<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9dfe0">
<title>Elev · Tavleloftet</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../js/tavleloftet-firebase.js"></script>
<link rel="stylesheet" href="../css/elev-logginn.css">
<style>
  :root{--hoved:#0F6E63;--skygge:#0A4D45;--blekk:#1b2b27}
  /* Himmelen bak dioramaet. --verden settes når koden er funnet (verdenens farge). */
  body{--verden:#F4B942;background:linear-gradient(#a9dfe0 0%,#d3efe3 48%,#fdf0cc 100%) fixed;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s;
        background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--verden) 75%,#fff) 0%,color-mix(in srgb,var(--verden) 40%,transparent) 55%,transparent 85%)}
  body.farget::before{opacity:.8}
  #diorama{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;transform-origin:50% 50%;transition:transform 1.6s cubic-bezier(.6,0,.85,.4)}
  /* Kortet er plakaten på oppslagstavla. Treramma rundt tegnes i 3D og måles etter kortet. */
  .kort{position:relative;z-index:1;width:min(400px,100%);padding:26px 26px 18px;text-align:left;background:#fffdf6;border-radius:6px;
        box-shadow:0 2px 0 rgba(74,53,36,.28),inset 0 0 0 1px rgba(74,53,36,.08);transition:transform 1.1s cubic-bezier(.6,0,.4,1),opacity .8s .3s}
  /* to tegnestifter som holder plakaten */
  .kort::before,.kort::after{content:"";position:absolute;top:9px;width:14px;height:14px;border-radius:50%;background:#E9503F;box-shadow:inset -2px -3px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.18)}
  .kort::before{left:11px}
  .kort::after{right:11px;background:#F4B942}
  .merke{font:700 clamp(2rem,9vw,2.6rem)/1 'Fredoka',system-ui,sans-serif;color:#0F6E63;letter-spacing:.01em;margin:6px 0 0;text-align:center}
  .merke span{color:#9A6B10}
  h1{font:600 1.35rem/1.2 'Fredoka',system-ui,sans-serif;color:var(--blekk);margin:8px 0 16px;text-align:center}
  input{font:600 2rem/1 'Fredoka',system-ui,sans-serif;letter-spacing:.2em;padding:14px 8px;border:2px solid #b3ad9b;border-radius:10px}
  input:focus{border-color:var(--hoved);box-shadow:0 0 0 3px rgba(15,110,99,.28)}
  input::placeholder{color:#d5cfbd}
  .rad{align-items:stretch}
  .les{width:60px;height:auto;display:grid;place-items:center;background:#fff;border:2px solid #b3ad9b;border-radius:10px;color:var(--hoved)}
  .les svg{width:26px;height:26px;display:block}
  .les:active{background:#f3efe4}
  .start{margin-top:12px;padding:17px;font:600 1.25rem/1 'Fredoka',system-ui,sans-serif;border-radius:10px;box-shadow:0 4px 0 var(--skygge)}
  .start:active{transform:translateY(3px);box-shadow:0 1px 0 var(--skygge)}
  button:focus-visible{outline:3px solid #F4B942;outline-offset:2px}
  .melding{margin:12px 0 0;text-align:center}
  .liten{margin:12px 0 0;padding-top:12px;border-top:1px solid #e6dfcc;text-align:center}
  .fortsett{display:none;margin:0 0 18px;padding:14px;border-radius:10px;background:#f3efe4}
  .fortsett p{margin:0 0 10px;font-size:1rem}
  .fortsett button{display:block;width:100%;margin-top:8px;padding:14px;background:#fff;color:var(--blekk);border:2px solid #b3ad9b;border-radius:10px;font-size:1.1rem;text-align:left}
  .fortsett button:active{transform:translateY(2px)}
  /* Når koden er riktig: vi zoomer inn på tavla, og skjermen blir lys */
  body.inn #diorama{transform:scale(2.4)}
  body.inn .kort{transform:scale(1.5);opacity:0}
  #blink{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s;
        background:radial-gradient(circle,#fff 0%,#fff 35%,color-mix(in srgb,var(--verden) 45%,#fff) 100%)}
  body.inn #blink{opacity:1;transition-delay:1s}
  @media (prefers-reduced-motion:reduce){ #diorama{transition:none} .kort{transition:opacity .4s} body.inn #diorama,body.inn .kort{transform:none} .start:active{transform:none} }
</style>
</head>
<body>
<canvas id="diorama" aria-hidden="true"></canvas>
<main class="kort">
  <p class="merke">Tavle<span>loftet</span></p>
  <h1>Skriv inn koden din</h1>
  <div class="fortsett" id="fortsett"><p>Fortsett der du slapp:</p><div id="knapper"></div></div>
  <form id="skjema" autocomplete="off">
    <div class="rad">
      <input id="kode" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="7" placeholder="ABC-234" aria-label="Koden din">
      <button type="button" class="les" id="les" aria-label="Les opp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3l5-4v13l-5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.2 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    </div>
    <button class="start" id="start" type="submit">Start</button>
  </form>
  <p class="melding" id="melding" role="status" aria-live="polite"></p>
  <p class="liten">Har du ikke kode? Spør en voksen.</p>
</main>
<div id="blink"></div>

<!-- three.js (3D-motor, MIT-lisens) ligger lokalt. Dioramaet bygges i elev-diorama.js. -->
<script src="../js/three.min.js"></script>
<script src="../js/elev-diorama.js"></script>

<script>
(function(){
  'use strict';
  /* Verdener som kan logges inn i. Ny verden: legg den til her (mappe, navn, emoji og farge). */
  var VERDENER = {
    dinoparken: { navn: 'Dinoparken', emoji: '🦕', farge: '#5fd35a', farge2: '#e8c24a' },
    dinoparken2: { navn: 'Dinoparken', emoji: '🦕', farge: '#5fd35a', farge2: '#e8c24a' },
    lyslaget:   { navn: 'Lyslaget',   emoji: '🤖', farge: '#3aa8ff', farge2: '#7af0ff' }
  };
  var KODE_RE = /^[A-HJ-NP-Z2-9]{6}$/;
  var CFG = window.TAVLELOFTET_FIREBASE;
  var $ = function(id){ return document.getElementById(id); };
  var inn = $('kode'), melding = $('melding'), start = $('start');
  var fmt = function(k){ return k.slice(0,3) + '-' + k.slice(3); };
  function vis(t, type){ melding.textContent = t; melding.className = 'melding' + (type ? ' ' + type : ''); }
  function snakk(t){ try{ var u = new SpeechSynthesisUtterance(t); u.lang = 'nb-NO'; u.rate = .95; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

  // Himmelen får verdenens farge, raketten letter og vi zoomer inn på tavla
  function reis(verden, url){
    var v = VERDENER[verden];
    Diorama.farge(v.farge, v.farge2);
    setTimeout(function(){
      document.body.classList.add('inn');
      Diorama.inn(function(){ location.href = url; });
    }, 650);
  }

  var knapper = $('knapper'), noen = false;
  Object.keys(VERDENER).forEach(function(v){
    var okt = null; try { okt = JSON.parse(localStorage.getItem('tl-okt-' + v)); } catch (e) {}
    if (okt && KODE_RE.test(okt.kode || '')) {
      noen = true;
      var b = document.createElement('button'); b.type = 'button';
      b.textContent = VERDENER[v].emoji + ' ' + VERDENER[v].navn + ' (' + fmt(okt.kode) + ')';
      b.onclick = function(){ reis(v, '../' + v + '/'); };
      knapper.appendChild(b);
    }
  });
  if (noen) $('fortsett').style.display = 'block';

  inn.addEventListener('input', function(){
    var r = inn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/[IO01]/g, '').slice(0, 6);
    inn.value = r.length > 3 ? r.slice(0,3) + '-' + r.slice(3) : r;
    if (melding.className.indexOf('feil') > -1) { vis(''); Diorama.nøytral(); }
  });
  $('les').addEventListener('click', function(){ snakk('Hei! Skriv inn koden din og trykk på start. Har du ikke kode, spør en voksen.'); });

  $('skjema').addEventListener('submit', function(e){
    e.preventDefault();
    var kode = inn.value.replace('-', '');
    if (!KODE_RE.test(kode)) { vis('Koden har seks tegn, for eksempel ABC-234.', 'feil'); return; }
    if (!CFG || !CFG.databaseURL) { vis('Innlogging er ikke slått på ennå.', 'feil'); return; }
    start.disabled = true; vis('Leter etter verdenen din …');
    fetch(CFG.databaseURL.replace(/\/$/, '') + '/elever/' + kode + '/info.json', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('nett'); return r.json(); })
      .then(function(info){
        var v = info && VERDENER[info.verden];
        if (!v) { start.disabled = false; Diorama.farge('#ff7a6b', '#ffb36b'); vis('Fant ikke den koden. Sjekk at den er riktig.', 'feil'); snakk('Fant ikke den koden. Prøv igjen.'); return; }
        vis(v.emoji + ' Til ' + v.navn + '!', 'ok');
        reis(info.verden, '../' + info.verden + '/logginn.html?kode=' + kode);
      })
      .catch(function(){ start.disabled = false; vis('Får ikke kontakt med nettet. Prøv igjen om litt.', 'feil'); });
  });

  var fraLenke = (new URLSearchParams(location.search).get('kode') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (KODE_RE.test(fraLenke)) { inn.value = fmt(fraLenke); $('skjema').requestSubmit(); }
  else if (!noen) setTimeout(function(){ inn.focus(); }, 150);

  // Kommer eleven tilbake med «tilbake»-knappen, skal siden være klar igjen
  addEventListener('pageshow', function(e){ if (e.persisted) { document.body.classList.remove('inn'); location.reload(); } });
})();
</script>
</body>
</html>
