[hidden] { display: none !important; }
img { max-width: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { -webkit-tap-highlight-color: transparent; }


/* Layout: blueprint workshop wall; each job is a white work order pinned to it, number pad docked beside (or below on phones). */
:root {
  --bp: #133a6b;          /* blueprint blue */
  --bp-deep: #0d2b52;
  --grid: rgba(150, 195, 255, .14);
  --grid-fine: rgba(150, 195, 255, .06);
  --chalk: #e9f1ff;       /* text on blueprint */
  --chalk-dim: #a9bfdf;
  --paper: #f7f9fc;       /* work orders */
  --ink: #14213d;
  --muted: #56647d;
  --rule: #d4dbe7;
  --hazard: #ffc83d;      /* the one bold accent */
  --hazard-deep: #e0a800;
  --hazard-ink: #241a00;
  --ok: #1d7f47; --ok-bg: #e2f4e9;
  --try: #c9620f; --try-bg: #fff0e1;
  --f-display: 'Bangers', 'Impact', 'Arial Black', sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Verdana', system-ui, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--f-body); color: var(--chalk); font-size: 18px; line-height: 1.45;
  background-color: var(--bp);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-fine) 1px, transparent 1px), linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .tapp:focus-visible { outline: 4px solid var(--hazard); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }

/* ---------- top ---------- */
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--chalk-dim); margin: 0; }
h1.merke { font-family: var(--f-display); font-weight: 400; font-size: clamp(54px, 9vw, 104px); line-height: .9; margin: 6px 0 0;
  color: var(--hazard); letter-spacing: .02em; text-shadow: 4px 4px 0 var(--bp-deep); }
.hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 32px; align-items: center; margin-bottom: 36px; }
.hero p.lead { font-size: 22px; max-width: 30ch; margin: 18px 0 0; text-wrap: balance; }
.hero figure { margin: 0; position: relative; }
.hero img { width: 100%; display: block; border-radius: 6px; border: 3px solid var(--chalk); }
.hero figure::before, .hero figure::after { content: ""; position: absolute; width: 28px; height: 28px; border: 3px solid var(--hazard); }
.hero figure::before { top: -10px; left: -10px; border-right: 0; border-bottom: 0; }
.hero figure::after { bottom: -10px; right: -10px; border-left: 0; border-top: 0; }
.hero figcaption { font-size: 13px; color: var(--chalk-dim); margin-top: 8px; letter-spacing: .06em; text-transform: uppercase; }
.fremdrift { display: flex; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.bolter { display: flex; gap: 6px; flex-wrap: wrap; }
.bolt { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--chalk-dim); display: grid; place-items: center; }
.bolt.fylt { background: var(--hazard); border-color: var(--hazard); }
.bolt.fylt::after { content: ""; width: 8px; height: 8px; background: var(--hazard-ink); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.fremdrift span { font-weight: 700; }

/* ---------- arbeidsordre (stasjoner) ---------- */
.seksjon-tittel { font-family: var(--f-display); font-weight: 400; font-size: 34px; letter-spacing: .03em; margin: 0 0 14px; color: var(--chalk); }
.ordrer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.ordre { box-sizing: border-box; cursor: pointer; background: var(--paper); color: var(--ink); border-radius: var(--r);
  overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 0 rgba(5, 20, 45, .35);
  transition: transform .15s ease; }
.ordre:hover { transform: translateY(-3px); }
.ordre:focus-visible { outline: 4px solid var(--hazard); outline-offset: 4px; }
.ordre .topp { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 2px dashed var(--rule);
  font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ordre .bilde { aspect-ratio: 3 / 2; background: #1b2230; max-width: 100%; }
.ordre .bilde img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ordre .innhold { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.ordre h3 { font-family: var(--f-display); font-weight: 400; font-size: 36px; line-height: 1; margin: 0; letter-spacing: .02em; color: var(--st); }
.jobber { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.jobber li { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.jobber img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid var(--c); }
.jobber .hake { margin-left: auto; width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--rule); display: grid; place-items: center; }
.jobber .hake.ja { background: var(--ok); border-color: var(--ok); }
.jobber .hake.ja::after { content: ""; width: 10px; height: 6px; border: solid #fff; border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); }
.stempel { position: absolute; top: 58px; right: 14px; font-family: var(--f-display); font-size: 30px; color: var(--ok); border: 4px solid var(--ok);
  padding: 2px 12px; border-radius: 8px; transform: rotate(-9deg); background: rgba(247, 249, 252, .9); letter-spacing: .05em; }

.diplom-banner { margin-top: 28px; background: var(--hazard); color: var(--hazard-ink); border-radius: var(--r); padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.diplom-banner b { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .03em; }
.fot { margin-top: 40px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--chalk-dim); font-size: 14px; }
.lenkeknapp { background: none; border: 2px solid var(--chalk-dim); color: var(--chalk); border-radius: 999px; padding: 8px 16px; font-size: 15px; font-weight: 700; }

/* ---------- stasjonsvisning ---------- */
.stasjonstopp { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.tilbake { background: var(--bp-deep); border: 2px solid var(--chalk-dim); color: var(--chalk); border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 16px; }
.stasjonstopp h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 5vw, 46px); margin: 0; color: var(--hazard); letter-spacing: .03em; line-height: 1; }
.steg { display: flex; gap: 8px; }
.steg button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--chalk-dim); background: transparent; color: var(--chalk);
  font-family: var(--f-display); font-size: 22px; }
.steg button.na { border-color: var(--hazard); background: var(--hazard); color: var(--hazard-ink); }
.steg button.ferdig { border-color: #5fd08d; background: #5fd08d; color: #0c2a17; }

.arbeid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
.kort { background: var(--paper); color: var(--ink); border-radius: var(--r); box-shadow: 0 10px 0 rgba(5, 20, 45, .35); position: relative; overflow: hidden; }
.kort-topp { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 2px dashed var(--rule);
  font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.oppdrag { display: flex; gap: 16px; align-items: center; padding: 18px 20px 6px; }
.oppdrag img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 4px solid var(--c); flex-shrink: 0; }
.oppdrag p { margin: 0; font-size: clamp(20px, 2.6vw, 25px); line-height: 1.32; flex: 1; min-width: 0; text-wrap: pretty; }
.les { flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--rule); background: #fff; display: grid; place-items: center; }
.les svg { width: 26px; height: 26px; }
.kropp { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.hjelp { font-size: 16px; color: var(--muted); margin: 0; }
.hjelp b { color: var(--ink); }
.linje { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }

/* svarbokser */
.svar { width: 68px; height: 68px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; color: var(--ink);
  font-size: 34px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; flex-shrink: 0; padding: 0; }
.svar.aktiv { border-color: var(--hazard-deep); box-shadow: 0 0 0 5px rgba(255, 200, 61, .55); }
.svar.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.svar.feil { border-color: var(--try); background: var(--try-bg); }
.svar.liten { width: 54px; height: 54px; font-size: 26px; border-radius: 10px; }

/* bunn: tilbakemelding + sjekk */
.bunn { border-top: 2px dashed var(--rule); padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.boble { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px; font-size: 18px; min-height: 52px; }
.boble img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.boble span { background: #eaeef5; padding: 10px 14px; border-radius: 14px 14px 14px 4px; }
.boble.try span { background: var(--try-bg); color: #6b3305; }
.boble.ok span { background: var(--ok-bg); color: #0f4d2a; font-weight: 700; }
.stor-knapp { background: var(--hazard); color: var(--hazard-ink); border: 0; border-radius: 14px; padding: 16px 28px; font-size: 22px; font-weight: 700;
  box-shadow: 0 5px 0 var(--hazard-deep); min-height: 60px; }
.stor-knapp:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--hazard-deep); }
.stor-knapp.gronn { background: #5fd08d; color: #0c2a17; box-shadow: 0 5px 0 #2f9a5b; }
.ferdigstempel { position: absolute; top: 54px; right: 20px; font-family: var(--f-display); font-size: 40px; color: var(--ok); border: 5px solid var(--ok);

    if (n === 'slett') b.val = b.val.slice(0, -1); else b.val = b.val.length >= 2 ? String(n) : b.val + n;
    b.el.textContent = b.val; b.el.classList.remove('feil'); };
  document.querySelectorAll('.taster button').forEach(t => t.addEventListener('click', () => skrivFn(t.dataset.n)));
  document.getElementById('les').addEventListener('click', () => spill(o.lyd, o.tekst, true));
  spill(o.lyd, o.tekst);
  const knapp = document.getElementById('sjekk');
  knapp.onclick = () => {
    const tomme = bokser.filter(b => !b.låst && b.val === '');
    if (tomme.length) { ctx.si('Fyll ut alle boksene først.', '', 'svar/fyll-ut'); sett(tomme[0]); return; }
    let feil = 0;
    bokser.forEach(b => { if (b.låst) return; if (+b.val === b.ans) { b.låst = true; b.el.classList.remove('aktiv', 'feil'); b.el.classList.add('ok'); } else { feil++; b.el.classList.add('feil'); } });
    if (feil) { ctx.si('Nesten! Én boks er ikke riktig. Prøv igjen.', 'try', 'svar/nesten-en'); sett(bokser.find(b => !b.låst)); return; }
    const r = ekstra ? ekstra() : null;
    if (r) { ctx.si(r.msg, 'try', r.lyd); return; }
    fullfor();
  };
  const fullfor = () => {
    skrivFn = null; sett(null);
    const ros = ['Riktig! Takk for hjelpen!', 'Helt riktig! Du er en god mekaniker.', 'Supert! Jobben er ferdig.'];
    const ri = (st.stadium + st.oppg) % 3;
    st.oppg++;
    const nyttStadium = st.oppg >= 3;
    if (nyttStadium) { st.oppg = 0; st.stadium++; }
    if (st.stadium >= 5) st.ferdig = true;
    lagre();
    document.querySelector('.kort').insertAdjacentHTML('beforeend', '<div class="ferdigstempel">RIKTIG!</div>');
    const bolter = document.querySelectorAll('.pilpanel .bolt'); if (bolter[nyttStadium ? 2 : st.oppg - 1]) bolter[nyttStadium ? 2 : st.oppg - 1].classList.add('fylt');
    if (nyttStadium) {
      forvandle(st.stadium + 1);
      ctx.si(st.ferdig ? 'Pil er ferdig forvandlet! Nå kan han rykke ut.' : `Pil forvandler seg! Klikk! Klakk! Stadium ${st.stadium + 1} av 6.`, 'ok', st.ferdig ? 'u/klar' : 'u/forvandler');
      knapp.textContent = st.ferdig ? 'Rykk ut! →' : 'Neste oppgave →';
    } else { ctx.si(ros[ri], 'ok', `svar/riktig-${ri + 1}`); knapp.textContent = 'Neste oppgave →'; }
    knapp.className = 'stor-knapp gronn'; knapp.onclick = () => { stopp(); st.ferdig ? klar() : oppgave(); }; knapp.focus();
  };
  window.scrollTo(0, 0);
}
function forvandle(nyttBilde) {
  const img = document.getElementById('pilImg'), k = document.getElementById('klikk');
  const ny = new Image(); ny.src = `media/pil/${nyttBilde}.jpg`;
  const bytt = () => { img.classList.add('blink'); setTimeout(() => { img.src = ny.src; img.classList.remove('blink'); }, 220); };
  ny.complete ? bytt() : (ny.onload = bytt);
  k.classList.remove('vis'); void k.offsetWidth; k.classList.add('vis');
  const pst = document.querySelectorAll('.pst'); pst.forEach((p, i) => { p.classList.toggle('ferdig', i < nyttBilde); p.classList.toggle('na', i === nyttBilde - 1); });
  const info = document.querySelector('.pilinfo b'); if (info) info.textContent = `Stadium ${nyttBilde} av 6`;
}

function klar() {
  stopp();
  app.innerHTML = `${topp()}
  <article class="kort klar-kort" style="--c:${ROB.pil.farge}">
    <div class="kort-topp"><span>Pil er klar</span><span>15 av 15 oppgaver</span></div>
    <div class="videoramme"><video id="video" playsinline preload="auto" poster="media/pil/6.jpg"><source src="media/pil-suser-avgarde.mp4" type="video/mp4"></video></div>
    <div class="bunn"><div class="boble ok"><img src="${face('pil')}" alt=""><span>Klar, ferdig, kjør!</span></div>
      <button class="stor-knapp" id="rykkut">Rykk ut!</button></div>
  </article>`;
  koblTopp();
  const v = document.getElementById('video'); v.muted = !lydPa;
  const knapp = document.getElementById('rykkut');
  let reserve = null;
  const videre = () => { clearTimeout(reserve); knapp.disabled = false; knapp.dataset.ferdig = '1'; knapp.textContent = 'Se hvordan det gikk →'; knapp.className = 'stor-knapp gronn'; knapp.focus(); };
  knapp.addEventListener('click', () => { if (knapp.dataset.ferdig) { slutt(); return; } knapp.disabled = true; spill(['u/kjor'], 'Klar, ferdig, kjør!');
    reserve = setTimeout(videre, 9000); /* om videoen ikke kan spilles, kommer eleven likevel videre */
    try { v.currentTime = 0; } catch (e) {} const pr = v.play(); if (pr && pr.catch) pr.catch(videre); });
  v.addEventListener('ended', videre);
  v.addEventListener('error', videre);
  v.querySelector('source').addEventListener('error', videre);
  window.scrollTo(0, 0);
}
function slutt() {
  app.innerHTML = `${topp()}
  <article class="kort slutt-kort" style="--c:${ROB[SC.hjelper].farge}">
    <div class="kort-topp"><span>Utrykning fullført</span><span>${SC.tittel}</span></div>
    <div class="feiring"><img src="media/slutt/${SC.id}.jpg" alt="">
      <div><h3>Oppdraget er fullført!</h3><p>${SC.slutt}</p>
      <div class="slutt-knapper"><button class="stor-knapp gronn" id="ny">Ny utrykning</button><a class="stor-knapp" href="index.html">Til start</a></div>
      <p class="hjelp lys">En ny utrykning kommer på mandag.</p></div></div>
    <div class="ferdigstempel">FULLFØRT!</div>
  </article>`;
  koblTopp();
  spill([`u/slutt-${SC.id}`, 'u/fullfort'], SC.slutt);
  document.getElementById('ny').addEventListener('click', nyUtrykning);
  window.scrollTo(0, 0);
}
function nyUtrykning() { stopp(); variant += 1; skrivLS(`ru-var-${UKEKEY}`, variant); lastUtrykning(); alarm(); }

function voksne() {
  const el = document.createElement('div'); el.className = 'voksen'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  const fasit = o => o.kat === 'lesing' ? (ROB[o.svar] ? ROB[o.svar].navn : o.svar) : o.svar;
  const tegn = () => {
    el.innerHTML = `<div class="voksen-kort"><h2>For voksne</h2>
      <p>Hver utrykning har 15 oppgaver: én matte, én lesing og én skriving per stadium. Situasjonen byttes hver mandag. Nå: <b>${SC.tittel}</b>, nivå <b>${NIVAER[nivaa].navn}</b>.</p>
      <h3>Nivå (gjelder også Verkstedet)</h3><div class="nivaavalg">${Object.entries(NIVAER).map(([k, v]) =>
        `<button class="nivaa${k === nivaa ? ' på' : ''}" data-n="${k}"><b>${v.navn}</b><span>${v.besk}</span></button>`).join('')}</div>
      <h3>Fasit</h3><div class="fasit">${STADIER.map((s, si) => s.map((o, oi) => `<div><b>${si * 3 + oi + 1}.</b> ${KATNAVN[o.kat]}: ${fasit(o)}</div>`).join('')).join('')}</div>
      <h3>Tips</h3><ul>
        <li>Lesetekstene leses ikke opp, bare instruksen. Da må eleven lese selv.</li>
        <li>Skriveoppgavene bruker bokstavbrikker, én bokstav som mangler, og tastatur.</li>
        <li>Fremgangen lagres på denne maskinen, så eleven kan fortsette senere.</li></ul>
      <div class="voksen-knapper"><button class="lenkeknapp mork" id="ekstra">Ny utrykning nå</button><button class="fare" id="nullstill">Start denne på nytt</button><button class="lukk" id="lukk">Lukk</button></div></div>`;
    el.querySelectorAll('.nivaa').forEach(b => b.addEventListener('click', () => { nivaa = b.dataset.n; skrivLS('rv-nivaa', nivaa); lastUtrykning(); tegn(); alarm(); document.body.appendChild(el); }));
    el.querySelector('#lukk').addEventListener('click', () => el.remove());
    el.querySelector('#ekstra').addEventListener('click', () => { el.remove(); nyUtrykning(); });
    let bekreft = false;
    el.querySelector('#nullstill').addEventListener('click', e => { if (!bekreft) { bekreft = true; e.target.textContent = 'Trykk igjen for å starte på nytt'; return; }
      st = { stadium: 0, oppg: 0, startet: false, ferdig: false }; lagre(); el.remove(); alarm(); });
  };
  el.addEventListener('click', e => { if (e.target === el) el.remove(); });
  document.body.appendChild(el); tegn();
}
document.addEventListener('keydown', e => {
  if (document.querySelector('.voksen')) { if (e.key === 'Escape') document.querySelector('.voksen').remove(); return; }
  if (!skrivFn || document.activeElement && document.activeElement.id === 'skrivinn') return;
  if (/^[0-9]$/.test(e.key)) { skrivFn(e.key); e.preventDefault(); } else if (e.key === 'Backspace') { skrivFn('slett'); e.preventDefault(); }
});
if (location.hash === '#test') window.__ru = { get o() { return STADIER[st.stadium][st.oppg]; }, get st() { return st; } };
alarm();
})();

</script>

</body>
