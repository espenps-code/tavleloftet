[hidden] { display: none !important; }
img { max-width: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { -webkit-tap-highlight-color: transparent; }

/* Layout: samme blåkopi-vegg som resten av Lyslaget. Kartet er en togstrekning; hver stasjon følger fast rute Se → Sammen → Selv → Ferdig. */
:root {
  --bp: #133a6b; --bp-deep: #0d2b52; --grid: rgba(150, 195, 255, .14); --grid-fine: rgba(150, 195, 255, .06);
  --chalk: #e9f1ff; --chalk-dim: #a9bfdf; --paper: #f7f9fc; --ink: #14213d; --muted: #56647d; --rule: #d4dbe7;
  --hazard: #ffc83d; --hazard-deep: #e0a800; --hazard-ink: #241a00;
  --ok: #1d7f47; --ok-bg: #e2f4e9; --try: #b4560f; --try-bg: #fff0e1;
  --spor: #1d1d1f; --gull: #F2C14E; --gull-mork: #7A5C0E;
  --lille: #D9480F; --store: #1C4FD8; --over: #2B8A3E; --paa: #7048E8;
  --f-display: 'Bangers', 'Impact', 'Arial Black', sans-serif; --f-body: 'Atkinson Hyperlegible', 'Verdana', system-ui, sans-serif;
  --r: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font: 18px/1.45 var(--f-body); color: var(--chalk); background-color: var(--bp);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-fine) 1px, transparent 1px), linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 4px solid var(--hazard); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--chalk-dim); margin: 0; }
.lille-t { color: var(--lille); font-weight: 700; } .store-t { color: var(--store); font-weight: 700; }
.over-t { color: var(--over); font-weight: 700; } .paa-t { color: var(--paa); font-weight: 700; }

/* ---------- topp ---------- */
.topplinje { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.pille { background: var(--bp-deep); border: 2px solid var(--chalk-dim); color: var(--chalk); border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 16px; text-decoration: none; min-height: 48px; display: inline-flex; align-items: center; gap: 8px; }
.pille.pa { background: var(--hazard); color: var(--hazard-ink); border-color: var(--hazard); }
.knapper { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- kart ---------- */
.hero { display: grid; grid-template-columns: 1fr 1.05fr; gap: 32px; align-items: center; margin-bottom: 34px; }
h1.merke { font-family: var(--f-display); font-weight: 400; font-size: clamp(56px, 9vw, 104px); line-height: .9; margin: 6px 0 0; color: var(--hazard); letter-spacing: .02em; text-shadow: 4px 4px 0 var(--bp-deep); }
.hero p.lead { font-size: 22px; max-width: 32ch; margin: 16px 0 0; text-wrap: balance; }
.hero figure { margin: 0; position: relative; }
.hero img { width: 100%; display: block; border-radius: 6px; border: 3px solid var(--chalk); }
.hero figure::before, .hero figure::after { content: ""; position: absolute; width: 28px; height: 28px; border: 3px solid var(--hazard); }
.hero figure::before { top: -10px; left: -10px; border-right: 0; border-bottom: 0; }
.hero figure::after { bottom: -10px; right: -10px; border-left: 0; border-top: 0; }
.framdrift { margin-top: 22px; }
.framdrift b { font-size: 20px; }
.linjebar { display: flex; gap: 4px; margin-top: 8px; max-width: 420px; }
.linjebar i { flex: 1; height: 12px; border-radius: 3px; background: rgba(169, 191, 223, .25); }
.linjebar i.ja { background: var(--hazard); }
.start-stor { margin-top: 20px; background: var(--hazard); color: var(--hazard-ink); font-weight: 700; font-size: 22px; padding: 14px 26px; border-radius: 14px; border: 0; box-shadow: 0 5px 0 var(--hazard-deep); }

.strekning { margin-bottom: 30px; }
.strekning h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; letter-spacing: .03em; margin: 0 0 4px; color: var(--chalk); }
.strekning > p { margin: 0 0 12px; color: var(--chalk-dim); }
.rute { list-style: none; margin: 0; padding: 0 0 0 30px; position: relative; display: grid; gap: 12px; }
.rute::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 6px; border-radius: 3px;
  background: repeating-linear-gradient(180deg, #7d6a3a 0 6px, transparent 6px 14px), linear-gradient(90deg, #c9b37a 0 1px, transparent 1px 5px, #c9b37a 5px 6px); }
.stopp { position: relative; display: flex; gap: 10px; align-items: stretch; }
.stopp .stoppkort { flex: 1; min-width: 0; }
.ovknapp { flex-shrink: 0; border: 0; border-radius: var(--r); background: var(--hazard); color: var(--hazard-ink); font-weight: 700; font-size: 18px; padding: 10px 18px; box-shadow: 0 6px 0 var(--hazard-deep); min-width: 112px; }
.ovknapp:hover { background: #ffd56a; }
.stopp::before { content: ""; position: absolute; left: -27px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: var(--bp); border: 4px solid var(--chalk-dim); }
.stopp.ferdig::before { background: var(--ok); border-color: #5fd08d; }
.stopp.neste::before { background: var(--hazard); border-color: var(--hazard); box-shadow: 0 0 0 5px rgba(255, 200, 61, .3); }
.stoppkort { width: 100%; text-align: left; display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; background: var(--paper); color: var(--ink);
  border: 0; border-radius: var(--r); padding: 12px 16px; box-shadow: 0 6px 0 rgba(5, 20, 45, .35); }
.stoppkort .nr { width: 54px; height: 54px; border-radius: 12px; background: var(--spor); color: var(--gull); font-family: var(--f-display); font-size: 30px; display: grid; place-items: center; }
.stoppkort h3 { margin: 0; font-size: 21px; }
.stoppkort p { margin: 2px 0 0; color: var(--muted); font-size: 16px; }
.status { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 99px; white-space: nowrap; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.na { background: var(--hazard); color: var(--hazard-ink); }
.status.las { background: #e7ebf2; color: var(--muted); }
.stopp.last .stoppkort { opacity: .62; cursor: not-allowed; }

details.laerer { margin-top: 40px; background: rgba(13, 43, 82, .7); border: 2px solid rgba(169, 191, 223, .35); border-radius: var(--r); padding: 14px 18px; }
details.laerer summary { cursor: pointer; font-weight: 700; font-size: 17px; min-height: 32px; }
details.laerer h3 { margin: 18px 0 6px; font-size: 18px; color: var(--hazard); }
details.laerer p, details.laerer li { font-size: 16px; color: var(--chalk); }
details.laerer ul { padding-left: 20px; margin: 0; }
details.laerer li { margin-bottom: 4px; }
details.laerer .verktoy { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
details.laerer a { color: var(--hazard); }
.fot { margin-top: 26px; color: var(--chalk-dim); font-size: 14px; }

/* ---------- stasjon ---------- */
.st-tittel { display: flex; flex-direction: column; }
.st-tittel h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 5vw, 46px); margin: 0; color: var(--hazard); letter-spacing: .03em; line-height: 1; }
.plan { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0 0 16px; flex-wrap: wrap; align-items: center; }
.plan li { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; padding: 7px 14px 7px 8px; border-radius: 99px; border: 2px solid var(--chalk-dim); color: var(--chalk-dim); }
.plan li .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(169, 191, 223, .25); color: var(--chalk); font-size: 14px; }
.plan li.na { background: var(--hazard); border-color: var(--hazard); color: var(--hazard-ink); }
.plan li.na .n { background: var(--hazard-ink); color: var(--hazard); }
.plan li.gjort { border-color: #5fd08d; color: #c9f5da; }
.plan li.gjort .n { background: #5fd08d; color: #0c2a17; }
.plan .pil { color: var(--chalk-dim); font-weight: 700; border: 0; padding: 0; }

.kort { background: var(--paper); color: var(--ink); border-radius: var(--r); box-shadow: 0 10px 0 rgba(5, 20, 45, .35); overflow: hidden; }
.kort-topp { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 20px; border-bottom: 2px dashed var(--rule); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.snakk { display: flex; gap: 16px; align-items: center; padding: 18px 20px 4px; }
.snakk > img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 4px solid var(--gull); background: var(--spor); flex-shrink: 0; }
.snakk p { margin: 0; font-size: clamp(20px, 2.6vw, 25px); line-height: 1.35; flex: 1; min-width: 0; text-wrap: pretty; }
.les { flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--rule); background: #fff; display: grid; place-items: center; }
.les svg { width: 28px; height: 28px; }
.kropp { padding: 14px 20px 22px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.flate { width: min(380px, 86vw); }
.flate .klokke { width: 100%; height: auto; display: block; touch-action: none; }
.flate.still .klokke { cursor: pointer; }
.slidebilde { width: min(560px, 100%); border-radius: 10px; display: block; }
.flere { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; }
.flere.tre { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.flere figure { margin: 0; text-align: center; }
.flere figcaption { font-weight: 700; font-size: 18px; margin-top: 4px; }
.flere .klokke { width: 100%; height: auto; }

.valg { display: grid; gap: 10px; width: min(520px, 100%); }
.valg.rad { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.vbtn { min-height: 64px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 22px; font-weight: 700; padding: 10px 14px; position: relative; }
.vbtn:hover:not(:disabled) { background: #fff8e0; }

.vbtn.rett { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.vbtn.vis { box-shadow: 0 0 0 5px var(--hazard); }
.vbtn.vis::after { content: "Spor viser deg"; position: absolute; top: -12px; right: 10px; font-size: 12px; background: var(--hazard); color: var(--hazard-ink); padding: 1px 8px; border-radius: 99px; letter-spacing: .04em; }
.vbtn.klokkevalg { padding: 6px; min-height: 0; }

.vbtn.klokkevalg .klokke { width: 100%; height: auto; display: block; }
.vbtn.digital { font-family: ui-monospace, 'Consolas', monospace; font-size: 30px; letter-spacing: .06em; }

.digi { font-family: ui-monospace, 'Consolas', monospace; font-weight: 700; font-size: 40px; letter-spacing: .08em; background: var(--spor); color: var(--gull); padding: 6px 18px; border-radius: 10px; display: inline-block; }

.visere { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.viserbtn { min-height: 56px; border-radius: 14px; border: 3px solid var(--rule); background: #fff; color: var(--ink); font-weight: 700; font-size: 18px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.viserbtn i { display: block; border-radius: 4px; }

.sjekk { background: var(--ink); color: #fff; border: 0; border-radius: 14px; font-weight: 700; font-size: 21px; padding: 14px 28px; min-height: 58px; }

.melding { width: 100%; border-radius: 12px; padding: 14px 16px; font-size: 20px; display: flex; gap: 12px; align-items: flex-start; }
.melding.ok { background: var(--ok-bg); color: #0f4d2a; border-left: 6px solid var(--ok); }

.handling { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; width: 100%; }
.neste { background: var(--hazard); color: var(--hazard-ink); font-weight: 700; font-size: 22px; padding: 14px 30px; border-radius: 14px; border: 0; box-shadow: 0 5px 0 var(--hazard-deep); min-height: 60px; }

/* vogner = framdrift i Selv */
.tog { display: flex; align-items: flex-end; gap: 4px; margin-top: 18px; flex-wrap: wrap; }
.tog .lok { width: 54px; height: 34px; background: var(--spor); border-radius: 6px 14px 4px 4px; position: relative; border: 2px solid var(--gull); }
.tog .lok::after { content: ""; position: absolute; right: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--gull); }
.tog .vogn { width: 36px; height: 26px; border-radius: 4px; border: 2px solid var(--chalk-dim); background: transparent; }

.tog .vogn.na { border-color: var(--hazard); border-style: dashed; }
.togtekst { color: var(--chalk-dim); font-size: 15px; margin: 6px 0 0; }

/* ferdig */
.ferdigbilde { position: relative; width: 100%; }
.ferdigbilde img { width: 100%; display: block; max-height: 340px; object-fit: cover; object-position: 50% 60%; }
.stempel { position: absolute; top: 16px; right: 16px; font-family: var(--f-display); font-size: clamp(30px, 6vw, 48px); color: var(--ok); border: 5px solid var(--ok); padding: 2px 16px; border-radius: 10px; transform: rotate(-8deg); background: rgba(247, 249, 252, .94); letter-spacing: .05em; }
.kan { font-size: 22px; font-weight: 700; text-align: center; margin: 0; }

.pausedlg { border: 0; padding: 0; background: transparent; width: min(560px, calc(100vw - 32px)); color: var(--ink); }

.pausekort { background: var(--paper); border-radius: 18px; overflow: hidden; }
.pausekort img { width: 100%; display: block; }
.pausekort div { padding: 18px 22px 22px; text-align: center; }
.pausekort p { font-size: 22px; margin: 0 0 16px; }

/* diplom */
.diplom { background: #fffdf6; color: var(--ink); border-radius: 18px; border: 10px solid var(--spor); outline: 4px solid var(--gull); outline-offset: -18px; padding: 34px 28px; text-align: center; max-width: 760px; margin: 0 auto; }
.diplom h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(48px, 9vw, 84px); line-height: .95; margin: 6px 0; color: var(--gull-mork); letter-spacing: .03em; }
.diplom img { width: min(420px, 100%); border-radius: 10px; margin: 10px auto; display: block; }
.diplom input { font: 700 30px var(--f-body); text-align: center; border: 0; border-bottom: 3px solid var(--ink); background: transparent; width: min(420px, 100%); padding: 6px; color: var(--ink); }
.diplom ul { list-style: none; padding: 0; margin: 14px 0 0; font-size: 18px; }
.diplom li::before { content: "✓ "; color: var(--ok); font-weight: 700; }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }

}
.klokke .viser { transition: transform .45s cubic-bezier(.3, .7, .3, 1); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

}

/* ===== DESIGNLØFT (okt 2026) – hele blokken kan slettes for å gå tilbake ===== */
:root { --r: 18px; --dl-ease: cubic-bezier(.2, .8, .3, 1); --dl-tile: #c9d3e3; }
@keyframes dl-pop { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
@keyframes dl-rist { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes dl-inn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes dl-puls { 50% { box-shadow: 0 0 0 10px rgba(255, 200, 61, .22); } }
button, a, .ordre, .stoppkort { transition: transform .15s var(--dl-ease), box-shadow .15s var(--dl-ease), background-color .15s ease, border-color .15s ease, color .15s ease, filter .15s ease, opacity .15s ease; }
button:disabled { cursor: not-allowed; }

/* Gule hovedknapper: løfter seg ved hover, trykkes ned ved klikk */
.stor-knapp, .neste, .start-stor, .ovknapp { letter-spacing: .01em; }
.stor-knapp:hover:not(:disabled), button.neste:not(.sekundar):hover:not(:disabled), .start-stor:hover, .ovknapp:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--hazard-deep); filter: brightness(1.05); }
.stor-knapp:active:not(:disabled), button.neste:not(.sekundar):active:not(:disabled), .start-stor:active, .ovknapp:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--hazard-deep); }
.stor-knapp.gronn:hover:not(:disabled) { box-shadow: 0 7px 0 #2f9a5b; }
.stor-knapp.gronn:active:not(:disabled) { box-shadow: 0 1px 0 #2f9a5b; }

/* Pilleknapper på blå bakgrunn (tilbake, lyd, voksne osv.) */
.tilbake, .pille, .lenkeknapp, .lydknapp, .startlenke { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; }
.tilbake:hover, .pille:not(.pa):not(.horknapp):hover, .lenkeknapp:not(.mork):hover, .lydknapp:hover, .startlenke:hover { background: rgba(233, 241, 255, .12); border-color: var(--chalk); color: var(--chalk); }
.lenkeknapp.mork:hover, .angre:hover { background: #eef2f8; }
.horknapp:hover, .pille.pa:hover { filter: brightness(1.06); }
.tilbake:active, .pille:active, .lenkeknapp:active, .lydknapp:active, .angre:active, .startlenke:active { transform: scale(.96); }

/* Kort/arbeidsordre: litt mer dybde */
.kort, .pilpanel, .alarm, .diplom { box-shadow: 0 10px 0 rgba(5, 20, 45, .35), 0 28px 48px -24px rgba(0, 0, 0, .55); }
.kort-topp { background: #eef3fa; }
.melding, .boble.ok span, .boble.try span { animation: dl-inn .3s var(--dl-ease); }

/* Dialoger */
dialog[open] > * , .voksen-kort { animation: dl-inn .25s var(--dl-ease); }
.lukk:hover { filter: brightness(1.15); transform: scale(1.04); }

@media (hover: none) { .stor-knapp:hover, button.neste:hover, .start-stor:hover, .ovknapp:hover { transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* Kart: stoppene */
.stopp:not(.last) .stoppkort:hover { transform: translateY(-3px); box-shadow: 0 9px 0 rgba(5, 20, 45, .35), 0 24px 40px -22px rgba(0, 0, 0, .6); }
.stopp:not(.last) .stoppkort:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(5, 20, 45, .35); }
.stopp.neste .stoppkort { box-shadow: 0 0 0 4px var(--hazard), 0 6px 0 rgba(5, 20, 45, .35); }
.stopp.neste .stoppkort:hover { box-shadow: 0 0 0 4px var(--hazard), 0 9px 0 rgba(5, 20, 45, .35); }
.stopp:not(.last) .stoppkort:hover .nr { transform: rotate(-4deg) scale(1.05); }
.stoppkort .nr { transition: transform .2s var(--dl-ease); }
details.laerer summary:hover { color: var(--hazard); }

/* Stasjon: steg-pillene */
.plan li.na { box-shadow: 0 0 0 5px rgba(255, 200, 61, .25); }

/* Svarvalg */
.vbtn:not(.vis):not(.rett):not(.feil), .viserbtn:not([aria-pressed="true"]) { box-shadow: 0 4px 0 var(--dl-tile); }
.vbtn:hover:not(:disabled):not(.feil):not(.rett) { transform: translateY(-2px); }
.vbtn:active:not(:disabled) { transform: translateY(2px); }
.vbtn.rett { animation: dl-pop .35s var(--dl-ease); }
.vbtn.feil { animation: dl-rist .35s; }
.viserbtn:hover { transform: translateY(-2px); border-color: #8696b3; }
.viserbtn:active { transform: translateY(2px); }
.sjekk { box-shadow: 0 5px 0 #050c1c; }
.sjekk:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #050c1c; background: #1d2d52; }
.sjekk:active { transform: translateY(3px); box-shadow: 0 1px 0 #050c1c; }
.neste.sekundar:hover { background: #eef2f8; }
.neste.sekundar:active { transform: scale(.97); }
.les:hover { border-color: var(--ink); transform: scale(1.06); }
.les:active { transform: scale(.94); }

/* Toget i «Selv» */
@keyframes dl-vogn { 50% { border-color: rgba(255, 200, 61, .35); } }
.tog .vogn.na { animation: dl-vogn 1.2s ease-in-out infinite; }
.tog .vogn.ja { animation: dl-pop .35s var(--dl-ease); }
</style>

    <div><p id="pausetittel"><b>Pause.</b> Spor venter på deg. Pust rolig inn … og rolig ut. Ingen ting haster.</p>
      <button type="button" class="neste" id="klar">Jeg er klar</button></div></div>
</dialog>
<script>
/*KJERNE-START*/
/* ---------- klokkespråk (bokmål) ---------- */
const TIMEORD = ['', 'ett', 'to', 'tre', 'fire', 'fem', 'seks', 'sju', 'åtte', 'ni', 'ti', 'elleve', 'tolv'];
const t12 = h => ((h - 1) % 12 + 12) % 12 + 1;
const hw = h => TIMEORD[t12(h)];
// [ord foran timen, bruker neste time?]
const DEL = { 0: ['', 0], 5: ['fem over', 0], 10: ['ti over', 0], 15: ['kvart over', 0], 20: ['ti på halv', 1], 25: ['fem på halv', 1], 30: ['halv', 1],
  35: ['fem over halv', 1], 40: ['ti over halv', 1], 45: ['kvart på', 1], 50: ['ti på', 1], 55: ['fem på', 1] };
const DELKLIPP = { 5: 'd-fem-over', 10: 'd-ti-over', 15: 'd-kvart-over', 20: 'd-ti-pa-halv', 25: 'd-fem-pa-halv', 30: 'd-halv', 35: 'd-fem-over-halv', 40: 'd-ti-over-halv', 45: 'd-kvart-pa', 50: 'd-ti-pa', 55: 'd-fem-pa' };
const navnTime = (h, m) => DEL[m][1] ? t12(h + 1) : t12(h);
function frase(h, m) { const [p] = DEL[m]; const t = hw(navnTime(h, m)); return p ? `${p} ${t}` : t; }
const setning = (h, m) => `Klokka er ${frase(h, m)}`;
const frasKlipp = (h, m) => [...(m ? ['k/' + DELKLIPP[m]] : []), 'k/t-' + String(navnTime(h, m)).padStart(2, '0')];
const digital = (h, m) => `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
function sone(m) { if (m === 0) return 'hel'; if (m < 20) return 'over'; if (m < 30) return 'pahalv'; if (m === 30) return 'halv'; if (m < 45) return 'overhalv'; return 'pa'; }
/*KJERNE-SLUTT*/

(() => {
const les = (k, std) => { try { const v = localStorage.getItem(k); return v === null ? std : JSON.parse(v); } catch (e) { return std; } };
const skrivLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const bland = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const L = '<span class="lille-t">lilleviseren</span>', S = '<span class="store-t">storeviseren</span>';
const Lc = '<span class="lille-t">Lilleviseren</span>', Sc = '<span class="store-t">Storeviseren</span>';
const Ls = 'lilleviseren', Ss = 'storeviseren';

/* ---------- klokketegning ---------- */
const pt = (deg, r) => { const a = deg * Math.PI / 180; return [+(r * Math.sin(a)).toFixed(2), +(-r * Math.cos(a)).toFixed(2)]; };
function sektor(a0, a1, r, farge) {
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r); const stor = (a1 - a0) > 180 ? 1 : 0;
  return `<path d="M0 0 L${x0} ${y0} A${r} ${r} 0 ${stor} 1 ${x1} ${y1} Z" fill="${farge}"/>`;
}
function bue(a0, a1, r, farge, b) {
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="${farge}" stroke-width="${b}"/>`;
}
const vinkelLille = (h, m) => ((h % 12) + m / 60) * 30;
const vinkelStore = m => m * 6;
function viser(type, vinkel, o = {}) {
  const lille = type === 'lille';
  const len = lille ? 42 : 60, b = lille ? 11 : 6, farge = lille ? '#D9480F' : '#1C4FD8';
  const halo = o.fremhev ? `<line y1="12" y2="${-len}" stroke="#FFD43B" stroke-width="${b + 10}" stroke-linecap="round" opacity=".85"/>` : '';
  if (o.spokelse) return `<g class="spokelse" transform="rotate(${vinkel})"><line y1="0" y2="${-len}" stroke="${farge}" stroke-width="${b}" stroke-linecap="round" stroke-dasharray="3 7" opacity=".55"/></g>`;
  return `<g class="viser ${type}"${o.id ? ` id="${o.id}"` : ''} style="transform:rotate(${vinkel}deg)">${halo}<line y1="12" y2="${-len}" stroke="${farge}" stroke-width="${b}" stroke-linecap="round"/>${lille ? '' : `<circle cy="${-len}" r="0" />`}</g>`;
}
function klokke(o = {}) {
  const { h = 12, m = 0, lille = true, store = true, tall = true, mangler = null, merk = null, femRing = false, soner = null, skygge = null,
    fremhev = null, streker = false, spokelse = null, idPre = '', label = 'Klokke', tom = false } = o;
  const vb = soner ? 175 : femRing ? 145 : 112;
  let s = `<svg class="klokke" viewBox="${-vb} ${-vb} ${vb * 2} ${vb * 2}" role="img" aria-label="${esc(label)}">`;
  if (soner) {
    const deler = [[0, 90, '#2B8A3E', 'OVER', 45], [90, 180, '#7048E8', 'PÅ HALV', 135], [180, 270, '#2B8A3E', 'OVER HALV', 225], [270, 360, '#7048E8', 'PÅ', 315]];
    deler.forEach(([a0, a1, f, t, am], i) => {
      const vis = soner === 'alle' || (soner === 'topp' && (i === 0 || i === 3)) || (soner === 'bunn' && (i === 1 || i === 2));
      if (!vis) return;
      s += bue(a0 + 2, a1 - 2, 118, f, 10);
    });
  }
  s += `<circle r="108" fill="#1d1d1f"/><circle r="104" fill="#F2C14E"/><circle r="99" fill="#fffdf6"/>`;
  if (soner) {
    [[45, '#2B8A3E', 'OVER', 0], [135, '#7048E8', 'PÅ HALV', 1], [225, '#2B8A3E', 'OVER HALV', 2], [315, '#7048E8', 'PÅ', 3]].forEach(([am, f, t, i]) => {
      const vis = soner === 'alle' || (soner === 'topp' && (i === 0 || i === 3)) || (soner === 'bunn' && (i === 1 || i === 2)); if (!vis) return;
      const [x, y] = pt(am, 128); const anker = am < 180 ? 'start' : 'end'; const dx = am < 180 ? 4 : -4;
      s += `<text x="${x + dx}" y="${y + (y > 0 ? 16 : -4)}" text-anchor="${anker}" font-size="15" font-weight="700" fill="${f}" paint-order="stroke" stroke="#fffdf6" stroke-width="4" font-family="Atkinson Hyperlegible, Verdana, sans-serif">${t}</text>`;
    });
  }
  if (skygge) skygge.forEach(([a, b, f]) => { s += sektor(a, b, 97, f); });
  if (streker) for (let i = 0; i < 60; i++) if (i % 5) { const [x0, y0] = pt(i * 6, 93), [x1, y1] = pt(i * 6, 97); s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#9aa3b5" stroke-width="1.4"/>`; }
  for (let n = 1; n <= 12; n++) { const [x0, y0] = pt(n * 30, 89), [x1, y1] = pt(n * 30, 97); s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#1d1d1f" stroke-width="3.2" stroke-linecap="round"/>`; }
  if (tall) for (let n = 1; n <= 12; n++) {
    const [x, y] = pt(n * 30, 76);
    if (n === mangler) { s += `<circle cx="${x}" cy="${y}" r="15" fill="#fff3c4" stroke="#e0a800" stroke-width="2.5" stroke-dasharray="4 4"/><text x="${x}" y="${y + 8}" text-anchor="middle" font-size="22" font-weight="700" fill="#a07400" font-family="Atkinson Hyperlegible, Verdana, sans-serif">?</text>`; continue; }
    if (n === merk) s += `<circle cx="${x}" cy="${y}" r="17" fill="#FFD43B"/>`;
    s += `<text x="${x}" y="${y + 8.5}" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d" font-family="Atkinson Hyperlegible, Verdana, sans-serif">${n}</text>`;
  }
  if (femRing) for (let n = 0; n < 12; n++) {
    const [x, y] = pt(n * 30, 125);
    s += `<text x="${x}" y="${y + 6}" text-anchor="middle" font-size="16" font-weight="700" fill="#1C4FD8" font-family="Atkinson Hyperlegible, Verdana, sans-serif">${n * 5}</text>`;
  }

    if (spokelse) { s += viser('store', vinkelStore(spokelse.m), { spokelse: true }); s += viser('lille', vinkelLille(spokelse.h, spokelse.m), { spokelse: true }); }
    if (store) s += viser('store', vinkelStore(m), { fremhev: fremhev === 'store', id: idPre ? idPre + 'store' : '' });
    if (lille) s += viser('lille', vinkelLille(h, m), { fremhev: fremhev === 'lille', id: idPre ? idPre + 'lille' : '' });
    s += `<circle r="8" fill="#1d1d1f"/><circle r="3.5" fill="#F2C14E"/>`;
  }
  return s + '</svg>';

function hint(o, niva) {

    case 'mot': return `${Lc} går samme vei som tallene: 1, 2, 3 … Hvilket tall kommer den til neste gang?`;
    case 'minutter': return `Tell med femmer fra 12 og fram til ${S}: 5, 10, 15 …`;
    case 'ruteOrd': case 'ruteKlokke': return `Tallet før kolon er timen. Tallet etter kolon er minuttene. ${digital(h, m)} er ${m} minutter over ${h}.${m ? ` På klokka peker ${S} da på ${n}.` : ` På klokka peker ${S} da på 12.`}`;

  const oppdater = () => {
    const sv = document.getElementById('still-store'), lv = document.getElementById('still-lille');
    if (sv) sv.style.transform = `rotate(${vinkelStore(s.m)}deg)`;
    if (lv) lv.style.transform = `rotate(${vinkelLille(s.h, s.m)}deg)`;
    svg.setAttribute('aria-label', `Klokke du kan stille. Lilleviseren nær ${t12(s.h)}, storeviseren på ${s.m / 5 || 12}.`);
  };
  let tidligere = { sv: vinkelStore(s.m), lv: vinkelLille(s.h, s.m) };
  const settFraPunkt = e => {
    const r = svg.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * .06) return;
    let a = Math.atan2(dx, -dy) * 180 / Math.PI; if (a < 0) a += 360;
    if (s.aktiv === 'store' && !o.kunLille) s.m = (Math.round(a / 30) % 12) * 5;
    else { let hh = Math.round(a / 30 - s.m / 60); s.h = t12(hh === 0 ? 12 : hh); }
    oppdater(); fjernMelding();
  };
  let trykk = false;
  svg.addEventListener('pointerdown', e => { trykk = true; try { svg.setPointerCapture(e.pointerId); } catch (x) {} settFraPunkt(e); });
  svg.addEventListener('pointermove', e => { if (trykk) settFraPunkt(e); });
  const slipp = () => { trykk = false; };
  svg.addEventListener('pointerup', slipp); svg.addEventListener('pointercancel', slipp);
  svg.setAttribute('tabindex', '0');
  svg.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return; e.preventDefault(); const d = e.key === 'ArrowRight' ? 1 : -1;
    if (s.aktiv === 'store' && !o.kunLille) s.m = ((s.m + d * 5) % 60 + 60) % 60; else s.h = t12(s.h + d);
    oppdater();
  });
  app.querySelectorAll('.viserbtn').forEach(b => b.addEventListener('click', () => {
    s.aktiv = b.dataset.v; app.querySelectorAll('.viserbtn').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  document.getElementById('sjekk').addEventListener('click', () => sjekkStill(o));
  void tidligere;
}
function fjernMelding() { const m = document.getElementById('melding'); if (m && tilstand && tilstand.niva < 1 && tilstand.fase === 2) m.innerHTML = ''; }
function sjekkStill(o) {
  const t = tilstand, s = t.stillT;
  const okM = s.m === o.m, okH = t12(s.h) === t12(o.h);
  if (okM && okH) return riktig(o);
  let msg;
  if (!okM) msg = `${Sc} skal peke på ${o.m / 5 || 12}.${o.m ? ` Tell med femmer: ${o.m} minutter.` : ' Da er klokka hel.'}`;
  else {
    const z = sone(o.m);
    if (z === 'hel') msg = `${Lc} skal peke rett på ${o.h}.`;
    else if (z === 'over') msg = `${Lc} skal være litt etter ${o.h}. Den har nettopp gått forbi ${o.h}.`;
    else if (o.m === 30) msg = `${Lc} skal være midt mellom ${o.h} og ${t12(o.h + 1)}, på vei mot ${t12(o.h + 1)}.`;
    else msg = `${Lc} skal være på vei mot ${t12(o.h + 1)}, men ikke helt fremme ennå.`;
    if (s.aktiv === 'store') msg += ` Trykk på knappen Lilleviseren først.`;
  }
  feil(o, null, msg);
}
function svar(verdi, knapp) {
  const t = tilstand; const o = t.ko[t.idx]; if (t.lost) return;
  if (verdi === o.svar) { knapp.classList.add('rett'); return riktig(o); }
  knapp.classList.add('feil'); knapp.disabled = true;
  feil(o, knapp);
}
function feil(o, knapp, egenTekst) {
  const t = tilstand; t.forsok++;
  t.niva = Math.min(2, t.niva + 1);
  if (t.fase === 2 && !o.gjentatt && t.ekstra < 4) { const kopi = { ...o, gjentatt: true }; t.ko.push(kopi); o.gjentatt = true; t.ekstra++; }
  // tegn på nytt med hint, men behold allerede utelukkede svar
  const utelukket = [...app.querySelectorAll('.vbtn.feil')].map(b => b.dataset.verdi);
  visOppgave(STASJONER[t.si]);
  utelukket.forEach(v => { const b = app.querySelector(`.vbtn[data-verdi="${v}"]`); if (b) { b.classList.add('feil'); b.disabled = true; } });
  const tekst = egenTekst && t.niva < 2 ? egenTekst : (hint(o, t.niva) || egenTekst);
  document.getElementById('melding').innerHTML = `<div class="melding hint"><p><b>Ikke helt.</b>${tekst}</p></div>`;
  snakk([], 'Ikke helt. ' + tekst);
}
function riktig(o) {
  const t = tilstand; t.lost = true;
  app.querySelectorAll('.vbtn').forEach(b => { b.disabled = true; if (b.dataset.verdi === o.svar) b.classList.add('rett'); });
  const sj = document.getElementById('sjekk'); if (sj) sj.hidden = true;
  let tekst, klipp;
  if (['tallMangler', 'tallEtter', 'mot'].includes(o.type)) { tekst = `Riktig! Svaret er ${o.svar}.`; klipp = ['k/riktig']; }
  else if (o.type === 'mellom') { tekst = `Riktig! ${Ls[0].toUpperCase() + Ls.slice(1)} er mellom ${o.svar} og ${t12(+o.svar + 1)}.`; klipp = ['k/riktig']; }
  else if (o.type === 'minutter') { tekst = `Riktig! Det er ${o.m} minutter.`; klipp = ['k/riktig']; }
  else { tekst = `Riktig! ${setning(o.h, o.m)}.${o.st.finale ? ` Det er ${digital(o.h, o.m)}.` : ''}`; klipp = ['k/riktig', 'k/klokka-er', ...frasKlipp(o.h, o.m)]; }
  document.getElementById('melding').innerHTML = `<div class="melding ok"><p><b>${esc(tekst)}</b></p></div>`;
  snakk(klipp, tekst);
  const sisteI = t.idx === t.ko.length - 1;
  const etikett = sisteI ? (t.fase === 1 ? 'Nå prøver du selv →' : 'Til stasjonen →') : 'Neste oppgave →';
  const hd = document.getElementById('handling');
  hd.innerHTML = `<button type="button" class="neste" id="nesteOppg">${etikett}</button>`;
  const nb = document.getElementById('nesteOppg'); nb.focus({ preventScroll: true });
  nb.addEventListener('click', () => {
    if (!sisteI) { t.idx++; nyOppgave(); return visOppgave(STASJONER[t.si]); }
    if (t.fase === 1) { t.fase = 2; t.introSagt = false; byggKo(STASJONER[t.si]); return visOppgave(STASJONER[t.si]); }
    t.fase = 3; visStasjon(); window.scrollTo(0, 0);
  });
}
function visFerdig(st) {
  const t = tilstand; merkFerdig(st.id);
  const nesteSi = t.si + 1 < STASJONER.length ? t.si + 1 : null;
  app.innerHTML = `${rammeTopp(st, t.si)}
    <section class="kort"><div class="ferdigbilde"><img src="media/klokka/ankomst.jpg" alt="Spor kommer inn på stasjonen i rute. Barn vinker."><span class="stempel">I RUTE!</span></div>
    ${snakkBoble('Alt i rute! Du er ferdig med denne stasjonen.')}
    <div class="kropp"><p class="kan">✓ ${st.maal}</p>
      <div class="handling">
        <button type="button" class="neste sekundar" id="ovmer">Øv mer her</button>
        ${st.finale ? '<button type="button" class="neste" id="diplomknapp">Se diplomet ditt →</button>' : nesteSi !== null ? `<button type="button" class="neste" id="nestest">Neste stasjon: ${STASJONER[nesteSi].navn} →</button>` : ''}
        <button type="button" class="neste sekundar" id="kart2">Til kartet</button></div></div></section>`;
  koblRamme();
  document.getElementById('lesknapp').addEventListener('click', () => snakk(['k/ferdig'], KLIPP_TEKST.ferdig, true));
  snakk(['k/ferdig'], KLIPP_TEKST.ferdig);
  document.getElementById('ovmer').addEventListener('click', () => { t.fase = 2; t.introSagt = false; byggKo(st); visOppgave(st); window.scrollTo(0, 0); });
  document.getElementById('kart2').addEventListener('click', visKart);
  const ns = document.getElementById('nestest'); if (ns) ns.addEventListener('click', () => startStasjon(nesteSi));
  const dk = document.getElementById('diplomknapp'); if (dk) dk.addEventListener('click', visDiplom);
}
function visDiplom() {
  stopp(); const navn = les('kl-navn', '');
  const d = new Date(); const dato = d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' });
  app.innerHTML = `<div class="topplinje ikke-print"><button type="button" class="pille" id="tilkart">← Kartet</button><div class="knapper"><button type="button" class="pille pa" id="skrivut">Skriv ut diplomet</button></div></div>
  <section class="diplom"><p class="eyebrow" style="color:#7A5C0E">Lyslaget · Spors stasjon</p><h1>Rutemester</h1>
    <img src="media/klokka/ankomst.jpg" alt="Spor kommer inn på stasjonen i rute">
    <p style="font-size:20px;margin:6px 0">Dette diplomet går til</p>
    <input id="navn" value="${esc(navn)}" placeholder="Skriv navnet ditt" aria-label="Navnet ditt" autocomplete="off">
    <ul><li>tallene på klokka</li><li>hele og halve timer</li><li>kvart over og kvart på</li><li>klokka på fem minutter</li><li>rutetabellen</li></ul>
    <p style="font-size:22px;font-weight:700;color:#7A5C0E;margin-top:14px">«Alt i rute!» – Spor</p><p style="color:#56647d">${dato}</p></section>`;
  document.getElementById('tilkart').addEventListener('click', visKart);
  document.getElementById('skrivut').addEventListener('click', () => window.print());
  document.getElementById('navn').addEventListener('input', e => skrivLS('kl-navn', e.target.value));
  snakk(['k/diplom'], KLIPP_TEKST.diplom);
  window.scrollTo(0, 0);
}

visKart();
window.__klokka = { STASJONER, lagOppgave, frase, feilTider, visKart, startStasjon, tegn: () => visStasjon(), get tilstand() { return tilstand; } };
})();
</script>
