<style>
:root{--hoved:#2C4A9A;--ink:#1c2a4a;--kort:#fbfcff;--gull:#F2C14E;--rod:#D3302C;--kant:#d5dcec;--dus:#4a5878}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink);font-size:18px;line-height:1.4;background:linear-gradient(#cdeefa,#eef6ff)}

canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

header{position:fixed;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none;flex-wrap:wrap}

header .luft{flex:1}
#gir{background:var(--kort);color:var(--ink);border:3px solid var(--ink);border-radius:50%;width:48px;padding:0;font-size:1.3rem}
#tags button{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--kort);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;min-height:44px;white-space:nowrap;font-size:.95rem;z-index:2;box-shadow:0 3px 0 rgba(28,42,74,.25)}

@media(max-width:600px){#tags:not(.liste) .t{display:none}#tags:not(.liste) button{padding:6px 10px;font-size:1.05rem}}

@media(min-width:800px){#panel{left:auto;top:76px;right:12px;bottom:12px;width:410px;max-height:none;border-bottom:3px solid var(--ink);border-radius:22px}}
.del{border-top:2px solid var(--kant);padding-top:12px;margin-top:12px}
.rad{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.liten{font-size:.9rem;color:var(--dus)}

/* Robotkortet – samme oppbygging som de utskrivbare kortene */
.kortdlg{border:0;padding:0;background:transparent;width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:visible;color:#14213d}
.kortdlg::backdrop{background:rgba(5,15,35,.72)}
.kort{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 14px 0 rgba(5,20,45,.45),0 30px 60px -20px rgba(0,0,0,.6);max-height:calc(100dvh - 32px);overflow-y:auto}
.khode{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 12px 20px;background:var(--k);color:var(--kt)}

.khoyre{display:flex;align-items:center;gap:8px}
.lagchip{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:2px solid currentColor;white-space:nowrap}
.kort .lukk{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:rgba(255,255,255,.92);color:#14213d;font-size:26px;line-height:1;display:grid;place-items:center}
.kbilde{position:relative;aspect-ratio:900/604;background:#111;border-bottom:5px solid var(--k)}
.kbilde img{width:100%;height:100%;object-fit:cover;display:block}
.blirpil{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--k);color:var(--kt);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:99px;white-space:nowrap}
.kbody{padding:14px 20px 18px}
.kbody .blir{font-size:19px;margin:0 0 10px}
.rader{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:17px}
.rader dt{color:#56647d;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.rader dd{margin:0;font-weight:700}
.prikker{display:inline-flex;gap:5px;vertical-align:middle}
.prikker i{width:15px;height:15px;border-radius:50%;border:2px solid var(--kp)}
.prikker i.p{background:var(--kp)}

.kbody .valg p{margin:0}.kbody .valg p+p{margin-top:4px}
.kbody .sier{margin:14px 0 0;font-size:21px;font-weight:700;color:var(--kp)}

.bla{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.bla button{font-size:17px;padding:10px 16px;min-height:44px;border-radius:12px;border:2px solid #d4dbe7;background:#f7f9fc;color:#14213d;box-shadow:0 4px 0 #c9d3e3}
/* Oppgavesiden som legger seg oppå verdenen */
#side{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:#0d2b52}
#side.apen{display:flex}
.sidetopp{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--kort);border-bottom:3px solid var(--ink)}
.sidetopp strong{font-family:Fredoka,sans-serif;font-size:1.15rem}
.sidetopp .luft{flex:1}
#side iframe{flex:1;width:100%;border:0;background:#fff}
#sideskruer{position:relative;transition:transform .2s}
#sideskruer.hopp{transform:scale(1.25);background:var(--gull)}
#sideskruer b{position:absolute;right:8px;top:100%;color:#1d5c33;background:#dff3e4;border-radius:999px;padding:2px 10px;margin-top:4px;animation:opp 1.4s ease-out forwards}
@keyframes opp{from{opacity:0;transform:translateY(8px)}20%{opacity:1}to{opacity:0;transform:translateY(-6px)}}
#laster{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:Fredoka,sans-serif;font-size:1.3rem;z-index:1}
@media (prefers-reduced-motion:no-preference){.dialog{animation:inn .18s ease-out}@keyframes inn{from{transform:translateY(12px);opacity:0}}}
/* ===== Nytt utseende på menyene (november 2026): mørk blå «robotflate», ekte bilder og egne ikoner ===== */
:root{--natt:#0e1a36;--natt2:#1b2f66;--lys:#5fd4ff;--flate:#f1f4fb}
.ikon{width:1.3em;height:1.3em;object-fit:contain;vertical-align:-.3em;flex:none}

.flis{display:grid;place-items:center;flex:none;width:62px;height:62px;border-radius:18px;background:radial-gradient(circle at 50% 30%,#2a4a94,#0e1a36 78%);box-shadow:inset 0 0 0 2px rgba(95,212,255,.28)}
.flis .ikon{width:80%;height:80%;vertical-align:0}
.flis span.ikon.tegn{width:auto;height:auto;font-size:1.9rem;line-height:1}

.skilt{border-radius:999px;padding:5px 20px 5px 5px;gap:10px}

.brikke{display:inline-flex;align-items:center;gap:6px;padding:6px 16px 6px 8px;font-family:Fredoka,sans-serif;font-size:1.15rem;min-height:46px}

#gir{display:grid;place-items:center;height:48px;font-size:1.3rem}
#gir .ikon{width:32px;height:32px;vertical-align:0}
/* Merkelappene i verdenen */
#tags button{display:inline-flex;align-items:center;gap:8px;background:#fff;border:0;border-radius:999px;padding:4px 16px 4px 4px;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.02rem;box-shadow:0 4px 0 rgba(8,16,38,.3),0 0 0 2.5px var(--natt)}
#tags button.last{background:linear-gradient(180deg,var(--natt2),var(--natt));color:#fff;border-style:none;box-shadow:0 4px 0 rgba(8,16,38,.3),inset 0 0 0 2px rgba(95,212,255,.32)}

#tags button.kommer .flis{background:#dfe5f2;box-shadow:none;width:30px;height:30px}
@media(max-width:600px){#tags:not(.liste) button{padding:4px;font-size:1rem}#tags:not(.liste) button.last{padding:4px 12px 4px 4px}}
#tags.liste button{justify-content:flex-start}
/* Panelet */
#panel{background:var(--flate);border:0;padding:0;box-shadow:0 0 0 3px var(--natt),0 -8px 30px rgba(8,16,38,.35)}

.phode{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;background:linear-gradient(135deg,var(--natt2),var(--natt));color:#fff}
.phode h2{margin:0;color:#fff;font-size:1.5rem}
.phode .under{display:block;font-size:.92rem;color:#c3d0ee;margin-top:2px}
.phode .midt{flex:1;min-width:0}
.phode .x{flex:none;width:48px;height:48px;min-height:48px;border-radius:50%;padding:0;background:rgba(255,255,255,.16);font-size:1.35rem}
.pkropp{padding:14px 14px 22px}
.pkropp .del{border-top:0;padding-top:0;margin-top:20px}
.pkropp .del>h3{font-size:.86rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dus);margin:0 0 8px 4px}
.stasjoner{display:grid;gap:10px}
.stasjon,.rkort{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-radius:20px;padding:9px 12px 9px 9px;min-height:80px;font-weight:400;box-shadow:0 4px 0 #c9d3e8,0 0 0 2px #dbe2f1;transition:transform .08s}

<div id="laster">Bygger basen …</div>
<canvas id="scene" aria-label="3D-oversikt over Lyslagets base"></canvas>
<header id="topp"><div id="toppv"></div><div class="lag" id="robotrad" aria-label="Robotene. Trykk på en robot for å se kortet."></div><span class="luft"></span><div id="topph"></div></header>

<script>
/* =====================================================================
   LYSLAGET-BASEN – ramme for en robotverden (prøveversjon)
   Del 1: regler og sider (denne blokka). Del 2: 3D-verdenen (lenger ned).
   Alt som har med OPPGAVER å gjøre går gjennom ett sted: startOppgave().
   Lagring bruker nøkler som starter med «lysbase-», slik at Tavleloftets
   elevinnlogging kan ta sikkerhetskopi på samme måte som i Dinoparken.
   ===================================================================== */

/* ---------- Tall du kan skru på (balansen i spillet) ---------- */
var NOKKEL = 'lysbase-spill';
var SIDER = true;   // true = stasjonene åpner de ekte Lyslaget-sidene (må ligge i samme mappe). false = bare prøveoppgaver.
var OPPSETT = {
  skruerPerOppgave: 5,   // skruer for én løst oppgave

};

/* ---------- Små hjelpere ---------- */
function rnd(n){return Math.floor(Math.random()*n)}
function klem(x,a,b){return Math.max(a,Math.min(b,x))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function omr(id){return OMRADER.filter(function(o){return o.id===id})[0]}
function robotomr(){return OMRADER.filter(function(o){return o.id!=='hk' && !o.kommer && !o.fri})}

/* ---------- Spillet (lagres på enheten) ---------- */
var S = null, apen = null, DEMO = false;
function lagre(){if(DEMO) return; try{localStorage.setItem(NOKKEL, JSON.stringify(S))}catch(e){}}
function fyllUt(t){robotomr().forEach(function(o){if(t.omr[o.id]==null) t.omr[o.id]=0}); return t}   // nye områder får plass i gamle lagringer
function hent(){try{var t=localStorage.getItem(NOKKEL);t=t?JSON.parse(t):null;return t&&t.v===1?fyllUt(t):null}catch(e){return null}}
function nyttSpill(){S = fyllUt({v:1, skruer:OPPSETT.startskruer, hk:1, omr:{}, form:{}, oppg:0, lost:{}}); sjekkJobber(); lagre()}
/* ?demo i adressen viser basen fullt utbygd uten å lagre noe. ?demo=3 viser nivå 3. */
function demoSpill(d){
  DEMO = true; nyttSpill(); S.hk = klem(d||5,1,5); S.skruer = 999;
  robotomr().forEach(function(o,i){S.omr[o.id] = S.hk>=5 ? 4 : (i<S.hk ? klem(S.hk-i+1,0,4) : 0)});
}

/* ---------- Regler ---------- */
function eier(id){return id==='hk' || !!omr(id).fri || S.omr[id]>=1}
function antallEid(){return robotomr().filter(function(o){return S.omr[o.id]>=1}).length}
function ledigePlasser(){return S.hk - antallEid()}          // nivået på hovedkvarteret = antall ladeplasser
function bonus(id){return id==='hk' ? 0 : Math.max(0, S.omr[id]-2)}   // utbygde områder gir +1 og +2 skruer
function belonning(id, grunn){   // kalles når en oppgave er løst. grunn = skruer før bonus (standard: skruerPerOppgave)
  var m = (grunn || OPPSETT.skruerPerOppgave) + bonus(id);
  S.skruer += m; S.oppg++; S.lost[id] = (S.lost[id]||0)+1; lagre();
  return m;
}
/* ---------- Jobber gjort på Lyslaget-sidene ----------
   Sidene lagrer selv hvor langt eleven er kommet. Verdenen leser det samme lageret og gir skruer
   for hver ny jobb. Ingenting er endret i selve sidene. */
var KILDER = [
  {prefiks:'rv-ferdig-', omr:'hk',   tell:function(v){var n = 0; for(var k in v) if(v[k]) n++; return n}},                    // Verkstedet: én per ferdig jobb
  {prefiks:'ru-frem-',   omr:'pil',  tell:function(v){return v.ferdig ? 15 : (v.stadium||0)*3 + (v.oppg||0)}},                 // Utrykning: 5 steg med 3 oppgaver
  {prefiks:'kl-ferdig',  omr:'spor', tell:function(v){return Array.isArray(v) ? v.length : 0}}                                 // Spors stasjon: én per ferdig stasjon
];
function tellJobber(){
  var ut = {};
  try{ for(var i=0;i<localStorage.length;i++){ var k = localStorage.key(i);
    KILDER.forEach(function(kilde){ if(k.indexOf(kilde.prefiks)===0){ try{ ut[k] = {n:kilde.tell(JSON.parse(localStorage.getItem(k))||{})||0, omr:kilde.omr} }catch(e){} } }); } }catch(e){}
  return ut;
}
function sjekkJobber(){   // gir skruer for jobber som er gjort siden sist. Returnerer hvor mange skruer det ble.
  if(!S) return 0;
  var na = tellJobber(), fikk = 0, k;
  if(!S.sett){ S.sett = {}; for(k in na) S.sett[k] = na[k].n; return 0 }   // første gang: jobber som var gjort fra før gir ikke skruer
  for(k in na){ var ny = na[k].n - (S.sett[k]||0); for(var j=0;j<ny;j++) fikk += belonning(na[k].omr); S.sett[k] = na[k].n }
  if(fikk) lagre();
  return fikk;
}
function byggHK(){
  var p = PRIS.hk[S.hk-1];
  if(S.hk>=5 || S.skruer<p) return false;
  S.skruer -= p; S.hk++; lagre(); return true;
}
function byggOmr(id){
  var n = S.omr[id], p = PRIS.omr[n];
  if(n>=4 || S.skruer<p || (n===0 && ledigePlasser()<1)) return false;
  S.skruer -= p; S.omr[id]++; lagre(); return true;
}

/* =====================================================================
   OPPGAVER – ETT STED Å BYTTE UT
   startOppgave(stasjon, ferdig) viser én oppgave og kaller ferdig() når
   eleven har svart riktig. Nå ligger det en enkel prøveoppgave her.
   ===================================================================== */
function startOppgave(stasjon, ferdig){
  var a = 1+rnd(9), b = 1+rnd(9), riktig = a+b, valg = [riktig];
  while(valg.length<4){var v = klem(riktig + rnd(7)-3, 1, 20); if(valg.indexOf(v)<0) valg.push(v)}
  valg.sort(function(){return Math.random()-.5});
  dialog('<p class="proeve">Prøveoppgave. De ekte oppgavene for «'+esc(stasjon.navn)+'» kommer senere.</p>'+
    '<h2>'+stasjon.ik+' '+esc(stasjon.navn)+'</h2><p class="stort">'+a+' + '+b+' = ?</p>'+
    '<div class="svar">'+valg.map(function(v){return '<button data-svar="'+v+'">'+v+'</button>'}).join('')+'</div>'+
    '<p style="margin-top:14px"><button class="sek" data-a="lukk">Avbryt</button></p>',
    function(el){
      el.addEventListener('click', function(e){
        var k = e.target.closest('[data-svar]'); if(!k) return;
        if(+k.dataset.svar === riktig) ferdig(); else {k.classList.add('feil'); k.disabled = true}
      });
    });
}

    '<dt>Liker</dt><dd>'+r.liker+'</dd><dt>Liker ikke</dt><dd>'+r.ikke+'</dd></dl>'+
    (r.valg ? '<div class="valg"><p><b>Dårlig valg:</b> '+r.valg+'</p><p><b>Kan lære:</b> '+r.laere+'</p></div>' : '')+
    '<p class="sier">«'+r.sier+'»</p>'+hit+
    '<div class="bla"><button type="button" data-bla="-1">← '+forrige.navn+'</button><button type="button" data-bla="1">'+neste.navn+' →</button></div></div></div>';
  if(!dlg.open){ if(typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open','') }
  dlg.querySelector('.kort').scrollTop = 0;
}
function lukkKort(){var dlg = document.getElementById('kortdlg'); if(dlg.open) dlg.close(); else dlg.removeAttribute('open')}

/* Oppgavesiden: en Lyslaget-side som legger seg oppå verdenen. Skruene telles mens eleven jobber. */
var sideTimer = null;
function apneSide(url, tittel, kamera){
  var l = document.getElementById('side');
  l.innerHTML = '<div class="sidetopp"><button data-a="lukkside">← Tilbake til basen</button><strong>'+esc(tittel)+'</strong><span class="luft"></span><span class="brikke" id="sideskruer">'+ikon('skrue','🔩')+S.skruer+'</span></div>'+
    '<iframe src="'+url+'" title="'+esc(tittel)+'"'+(kamera?' allow="camera; microphone; gyroscope; accelerometer"':'')+'></iframe>';
  l.className = 'apen';
  var f = l.querySelector('iframe'), forste = true;
  f.addEventListener('load', function(){   // trykker eleven «tilbake til forsiden» inne på siden, lukkes den i stedet
    try{ var sti = f.contentWindow.location.pathname; if(!forste && sti.slice(-url.length) !== url) lukkSide(); }catch(e){} forste = false; });
  clearInterval(sideTimer); sideTimer = setInterval(oppdaterSide, 1500);
}
function oppdaterSide(){
  var fikk = sjekkJobber(), el = document.getElementById('sideskruer'); if(!fikk || !el) return;
  el.innerHTML = ikon('skrue','🔩')+S.skruer+'<b>+'+fikk+'</b>'; el.classList.add('hopp'); setTimeout(function(){el.classList.remove('hopp')}, 500);
}
function lukkSide(){clearInterval(sideTimer); sideTimer = null; sjekkJobber(); var l = document.getElementById('side'); l.className = ''; l.innerHTML = ''; tegn()}

/* Ett kort per oppgavestasjon. last = 1: stasjonen ligger hos en robot som ikke har flyttet inn (kortet tar deg dit).
   last = 2: samme, men vist inne på området selv (bare til å se på). */
function stasjonKort(o, st, last){
  var flis = '<span class="flis">'+ikon(st.b||st.id, st.ik)+'</span>', tekst = '<span class="navn">'+st.navn+'</span><small>'+st.fag+'</small>';
  if(last){
    var inn = flis+'<span class="tekst">'+tekst+'<small class="status las">'+ikon('las','🔒')+'Åpner når '+ROBOTER[o.robot].navn+' flytter inn</small></span>';
    return last===2 ? '<div class="stasjon last">'+inn+'</div>' : '<button class="stasjon last" data-omr="'+o.id+'">'+inn+'<span class="gaa" aria-hidden="true">›</span></button>';
  }
  var under = st.oppg && window.LysOppgaver ? LysOppgaver.under(st) : '';
  return '<button class="stasjon" data-stasjon="'+o.id+':'+st.id+'">'+flis+'<span class="tekst">'+tekst+(under?'<small class="status">'+esc(under)+'</small>':'')+'</span><span class="gaa" aria-hidden="true">›</span></button>';
}
function stasjonsKnapper(o){
  var liste = synlige(o.id), grunn = OPPSETT.skruerPerOppgave + bonus(o.id);
  if(!liste.length) return '<p class="liten">Oppgavene her kommer senere.</p>';
  return '<div class="stasjoner">'+liste.map(function(st){return stasjonKort(o, st)}).join('')+'</div>'+
    '<p class="liten" style="margin:10px 4px 0">Hver riktig oppgave her gir '+pris(grunn)+' skruer.'+
      (liste.some(function(st){return st.oppg==='jegser'}) ? ' Et godkjent «Jeg ser»-bilde gir '+pris(15+bonus(o.id))+'.' : '')+'</p>';
}
function andreStasjoner(){   // vises i hovedkvarteret: oppgaver som venter hos roboter som ikke har flyttet inn ennå
  var h = robotomr().filter(function(a){return S.omr[a.id] < 2}).map(function(a){return synlige(a.id).map(function(st){return stasjonKort(a, st, 1)}).join('')}).join('');
  return h ? '<div class="del"><h3>Flere oppgaver hos robotene</h3><div class="stasjoner">'+h+'</div></div>' : '';
}
function formKnapp(o){
  var r = ROBOTER[o.robot];
  return '<button class="sek bred" data-form="'+o.id+'">'+ikon('forvandle','🔁')+(S.form[o.id] ? 'Forvandle tilbake til robot' : 'Forvandle til '+r.blir)+'</button>';
}
function mangler(p){return S.skruer<p ? '<p class="liten mangler">Du mangler '+(p-S.skruer)+' skruer. Løs oppgaver for å tjene flere.</p>' : ''}

/* ---------- Topplinje og merkelapper ---------- */
function tegnTopp(){
  document.getElementById('toppv').innerHTML = '<div class="skilt"><img class="volt" src="media/ansikt/volt.jpg" alt="" onerror="this.outerHTML=fjes(\'volt\',40)">'+
    '<span class="navn">Lyslaget-basen<span class="under">Nivå '+S.hk+' · '+HK[S.hk-1].navn+'</span></span></div>';
  document.getElementById('topph').innerHTML = '<span class="brikke" title="Skruer">'+ikon('skrue','🔩')+S.skruer+'</span><span class="brikke" title="Ladeplasser i bruk">'+ikon('lader','🔋')+antallEid()+'/'+S.hk+'</span>'+
    '<button id="gir" data-a="voksen" aria-label="Voksenmeny">'+ikon('tannhjul','⚙️')+'</button>';
}
function tegnTags(){
  document.getElementById('tags').innerHTML = OMRADER.map(function(o){
    if(o.kommer) return '<button class="kommer" data-omr="'+o.id+'" aria-label="'+o.navn+', kommer senere"><span class="flis liten">'+ikon('kommer','🚧')+'</span><span class="t">Kommer</span></button>';
    return eier(o.id) ? '<button data-omr="'+o.id+'" aria-label="'+o.navn+'"><span class="flis liten">'+ikon(o.id,o.ik)+'</span><span class="t">'+o.navn+'</span></button>'
                      : '<button class="last" data-omr="'+o.id+'" aria-label="'+o.navn+', til salgs for '+PRIS.omr[0]+' skruer"><span class="flis liten">'+ikon('las','🔒')+'</span><span class="t">Til salgs</span>'+pris(PRIS.omr[0])+'</button>'}).join('');
}

/* ---------- Panelet for hvert område ----------
   Hver panel-funksjon gir [linja under navnet i toppfeltet, innholdet]. */
function panelHK(o){
  var n = S.hk, p = PRIS.hk[n-1], h = robotKort('volt');
  h += '<div class="del"><h3>Oppgaver</h3>'+stasjonsKnapper(o)+'</div>'+andreStasjoner();
  h += '<div class="del"><h3>Bygg ut hovedkvarteret</h3><div class="bygg"><p><strong>Nivå '+n+' av 5: '+HK[n-1].navn+'</strong> '+nivaa(n,5)+'<br><span class="liten">'+HK[n-1].hva+'</span></p>'+
    (n<5 ? '<p class="neste"><strong>Neste: '+HK[n].navn+'.</strong> '+HK[n].hva+'</p><button class="kjop" data-hk="1"'+(S.skruer<p?' disabled':'')+'>Bygg ut'+pris(p)+'</button>'+mangler(p)
         : '<span class="merke">Ferdig utbygd</span>')+'</div>'+
    '<div style="margin-top:10px">'+formKnapp(o)+'</div></div>';
  h += '<div class="del"><h3>Ladeplasser</h3><p class="liten" style="margin:0 4px 8px">Hovedkvarteret har '+n+' '+(n===1?'ladeplass':'ladeplasser')+'. Hvert robotområde trenger én. Bygg ut hovedkvarteret for å få flere.</p>'+
    robotomr().map(function(a){var k = S.omr[a.id];
      return '<div class="linje"><span class="flis liten">'+ikon(a.id,a.ik)+'</span><span class="voks">'+a.navn+'</span>'+(k>=2?'<span class="merke">'+ROBOTER[a.robot].navn+' er på plass</span>':k===1?'<span class="merke vent">Bygd, venter på robot</span>':'<span class="merke vent">Ikke bygd</span>')+'</div>'}).join('')+'</div>';
  h += '<div class="del"><h3>Kommer senere</h3><p class="liten" style="margin:0 4px">Ukens robotquiz · Bøkene om Lyslaget · flere roboter på de ledige tomtene</p></div>';
  return ['Nivå '+n+' av 5 · '+HK[n-1].navn, h];
}
function panelOmr(o){
  var n = S.omr[o.id], r = ROBOTER[o.robot], p = PRIS.omr[n], t = TRINN[o.id], h = '';
  var venter = function(){var l = synlige(o.id); return l.length ? '<div class="del"><h3>Oppgaver som venter her</h3><div class="stasjoner">'+l.map(function(st){return stasjonKort(o, st, 2)}).join('')+'</div></div>' : ''};
  if(n===0){
    var full = ledigePlasser()<1;
    return ['Til salgs', '<div class="bygg"><p>'+o.om+'</p><p class="neste"><strong>Du får:</strong> '+t[0]+'.</p>'+
      '<button class="kjop" data-bygg="'+o.id+'"'+(S.skruer<p||full?' disabled':'')+'>Bygg området'+pris(p)+'</button>'+
      (full ? '<p class="liten mangler">Hovedkvarteret har ingen ledig ladeplass. Bygg ut hovedkvarteret først.</p>' : mangler(p))+'</div>'+venter()];
  }
  if(n===1){
    return ['Bygd – venter på '+r.navn, robotKort(o.robot)+'<div class="bygg" style="margin-top:12px"><p><strong>Området er bygd,</strong> men '+r.navn+' har ikke flyttet inn ennå. Oppgavene åpner når '+r.navn+' er på plass.</p>'+
      '<button class="kjop" data-bygg="'+o.id+'"'+(S.skruer<p?' disabled':'')+'>Kall inn '+r.navn+pris(p)+'</button>'+mangler(p)+'</div>'+venter()];
  }
  h += robotKort(o.robot);
  h += '<div class="del"><h3>Oppgaver hos '+r.navn+'</h3>'+stasjonsKnapper(o)+'</div>';
  h += '<div class="del"><h3>Bygg ut området</h3><div class="bygg"><p><strong>Trinn '+n+' av 4</strong> '+nivaa(n,4)+'</p>'+
    (n<4 ? '<p class="neste"><strong>Neste:</strong> '+t[n]+'. Gir én skrue ekstra per oppgave her.</p><button class="kjop" data-bygg="'+o.id+'"'+(S.skruer<p?' disabled':'')+'>Bygg ut'+pris(p)+'</button>'+mangler(p)
         : '<span class="merke">Alt er bygd</span>')+'</div>'+
    '<div style="margin-top:10px">'+formKnapp(o)+'</div></div>';
  return [r.navn+' bor her · trinn '+n+' av 4', h];
}
function panelFri(o){
  return ['Åpent for alle', '<div class="bygg"><p>'+o.om+'</p><button class="kjop" data-side="'+o.id+'">Start kameraet</button>'+
    '<p class="liten mangler">iPaden spør om lov til å bruke kameraet. Bildet blir på iPaden og sendes ikke noe sted.</p></div>'+
    '<div class="del"><h3>Mangler du robotkort?</h3><p class="liten" style="margin:0 4px">Kortene kan skrives ut. <a href="robotkort/Robotkort-utskrift.pdf" target="_blank" rel="noopener">Åpne robotkortene til utskrift</a></p></div>'+
    '<div class="del"><h3>Robotene</h3><p class="liten" style="margin:0 4px 8px">Trykk på en robot for å se kortet.</p><div class="lag">'+REKKE.map(ansikt).join('')+'</div></div>'];
}
function tegnPanel(){
  var p = document.getElementById('panel');
  if(!apen){p.className=''; p.innerHTML=''; return}
  var o = omr(apen), d = o.kommer ? ['Kommer senere', '<div class="bygg"><p>'+o.om+'</p><p class="liten">Tomta er satt av. Når området er laget, kan det kjøpes på samme måte som de andre.</p></div>'+(o.robot?'<div style="margin-top:12px">'+robotKort(o.robot)+'</div>':'')]
    : o.fri ? panelFri(o) : o.id==='hk' ? panelHK(o) : panelOmr(o);
  p.className = 'apen';
  p.innerHTML = '<div class="phode"><span class="flis stor">'+ikon(o.kommer?'kommer':o.id, o.ik)+'</span><div class="midt"><h2>'+o.navn+'</h2><span class="under">'+d[0]+'</span></div>'+
    '<button class="x" data-a="tilbake" aria-label="Lukk">✕</button></div><div class="pkropp">'+d[1]+'</div>';
}
function tegn(){tegnTopp(); tegnTags(); tegnPanel(); if(window.sync3D) window.sync3D()}
function apne(id){apen = id; tegnPanel(); document.getElementById('panel').scrollTop = 0; if(window.fokus3D) window.fokus3D(id)}

/* ---------- Dialoger (bygd inn i siden) ---------- */
function dialog(html, etter){
  var l = document.getElementById('lag');
  l.innerHTML = '<div class="overlegg"><div class="dialog" role="dialog" aria-modal="true">'+html+'</div></div>';
  var d = l.querySelector('.dialog'); if(etter) etter(d);
  var f = d.querySelector('button'); if(f) f.focus();
}
function lukk(){document.getElementById('lag').innerHTML=''; tegn()}
function velkommen(){
  dialog('<img class="helt" src="media/kort/volt.jpg" alt="Volt som robot og som buss" onerror="this.remove()">'+
    '<h2>Velkommen, mekaniker!</h2>'+
    '<p>Lyslaget trenger en base. Du starter med et lite verksted og roboten Volt.</p>'+
    '<p>Løs oppgaver og tjen skruer. Bruk skruene til å bygge ut hovedkvarteret og lage egne områder til robotene.</p>'+
    '<button class="kjop" data-a="start">Start</button>');
}
/* ---------- Voksenmenyen ----------
   På Tavleloftet (eleven er logget inn med kode) åpnes menyen med voksenkoden fra velkomstbrevet.
   I den frittstående utgaven åpnes den rett fra tannhjulet. */
function voksenPort(){
  if(!(window.TL && TL.kode && TL.sjekkVoksenkode)) return voksenMeny();
  dialog('<h2>For voksne</h2><p>Skriv voksenkoden. Den står i velkomstbrevet.</p>'+
    '<input id="vkinn" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" placeholder="Voksenkode" aria-label="Voksenkode" style="font:inherit;font-weight:700;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;width:100%;text-align:center;text-transform:uppercase">'+
    '<p class="liten" id="vkfb" style="min-height:1.4em;margin-top:8px"></p>'+
    '<div class="rad"><button data-a="vk-ok">Åpne</button><button class="sek" data-a="lukk">Avbryt</button></div>',
    function(el){var inn = el.querySelector('#vkinn'); inn.addEventListener('keydown', function(e){if(e.key==='Enter') provVoksenkode()}); setTimeout(function(){inn.focus()}, 60)});
}
function provVoksenkode(){
  var inn = document.getElementById('vkinn'), fb = document.getElementById('vkfb'); if(!inn) return;
  fb.textContent = 'Sjekker …';
  TL.sjekkVoksenkode(inn.value).then(function(ja){ if(ja) voksenMeny(); else {fb.textContent = 'Feil kode. Voksenkoden står i velkomstbrevet.'; inn.select()} });
}
function voksenMeny(){
  var o = window.LysOppgaver ? LysOppgaver.status() : null, inne = !!(window.TL && TL.kode);
  dialog('<h2>Voksenmeny</h2><p>Løste oppgaver totalt: <strong>'+S.oppg+'</strong></p>'+
    OMRADER.filter(function(a){return !a.kommer && !a.fri}).map(function(a){return '<div class="linje"><span class="flis liten">'+ikon(a.id,a.ik)+'</span><span class="voks">'+a.navn+'</span><strong>'+(S.lost[a.id]||0)+'</strong></div>'}).join('')+
    (o ? '<div class="del"><div class="linje"><span class="flis liten">'+ikon('venner','💛')+'</span><span class="voks">Venner og følelser</span><strong>Nivå '+o.venner.apnet+' av 3</strong></div>'+
         '<div class="linje"><span class="flis liten">'+ikon('kikk','🔭')+'</span><span class="voks">Jeg ser'+(o.jegser.venter?' <span class="merke vent">venter på godkjenning</span>':'')+'</span><strong>'+o.jegser.godkjent+' av '+o.jegser.av+' bilder</strong></div></div>' : '')+
    '<div id="vtid"></div>'+
    (inne ? '<p style="margin-top:10px"><a href="../rapport.html" target="_blank" rel="noopener">Se rapporten</a> (åpnes med voksenkoden)</p>' : '')+
    '<div class="rad" style="margin-top:14px"><button class="sek" data-a="lukk">Lukk</button>'+(inne ? '<button class="sek" data-a="loggut">Bytt elev (logg ut)</button>' : '')+'<button class="rod" data-a="nullstill">Nullstill spillet</button></div>',
    function(el){ if(window.TLTid) TLTid.panel(el.querySelector('#vtid')) });
}

/* ---------- Klikk ---------- */
function klikk(e){
  var t = e.target.closest('button'); if(!t || t.disabled) return; var d = t.dataset;
  if(d.a==='start'){nyttSpill(); return lukk()}
  if(d.kort) return visKort(d.kort);
  if(d.bla) return visKort(REKKE[(aktivtKort + +d.bla + REKKE.length) % REKKE.length]);
  if(d.a==='lukkkort') return lukkKort();
  if(!S) return;
  if(d.a==='lukkside') return lukkSide();
  if(d.side){var so = omr(d.side); return apneSide(so.side, so.navn, true)}
  if(d.omr){document.getElementById('lag').innerHTML=''; lukkKort(); return apne(d.omr)}
  if(d.a==='tilbake'){apen = null; tegnPanel(); if(window.fokus3D) window.fokus3D(null); return}
  if(d.a==='lukk') return lukk();
  if(d.a==='voksen') return voksenPort();
  if(d.a==='vk-ok') return provVoksenkode();
  if(d.a==='loggut'){ if(t.dataset.sikker){ if(window.TL && TL.loggUt) TL.loggUt(); } else { t.dataset.sikker = 1; t.textContent = 'Trykk igjen for å logge ut'; } return }
  if(d.a==='nullstill') return dialog('<h2>Nullstille alt?</h2><p>Skruene, hovedkvarteret og robotområdene blir borte. Dette kan ikke angres.</p><div class="rad"><button class="rod" data-a="nullstill-ja">Ja, nullstill</button><button class="sek" data-a="lukk">Nei, behold</button></div>');
  if(d.a==='nullstill-ja'){if(!DEMO){try{localStorage.removeItem(NOKKEL)}catch(x){} if(window.LysOppgaver) LysOppgaver.nullstill()} DEMO=false; S=null; apen=null; document.getElementById('panel').className=''; if(window.fokus3D) window.fokus3D(null); return velkommen()}
  if(d.stasjon){var del = d.stasjon.split(':'), st = STASJONER[del[0]].filter(function(s){return s.id===del[1]})[0];
    if(st.side && SIDER) return apneSide(st.side, st.navn);
    if(st.oppg && window.LysOppgaver && LysOppgaver.har(st)) return LysOppgaver.start(st, del[0]);
    return startOppgave(st, function(){var m = belonning(del[0]);
      dialog('<h2>✅ Riktig!</h2><p class="stort">+'+m+' '+ikon('skrue','🔩')+'</p><p style="text-align:center">Du har nå '+S.skruer+' skruer.</p>'+
        '<div class="rad"><button data-stasjon="'+d.stasjon+'">En til</button><button class="sek" data-a="lukk">Ferdig</button></div>');
      tegnTopp();
    })}
  if(d.hk){if(byggHK()){if(window.sprett3D) window.sprett3D('hk'); tegn()} return}
  if(d.bygg){if(byggOmr(d.bygg)){if(window.sprett3D) window.sprett3D(d.bygg); tegn()} return}
  if(d.form){S.form[d.form] = !S.form[d.form]; lagre(); if(window.sprett3D) window.sprett3D(d.form); tegn(); return}
}

if(typeof document !== 'undefined'){
  document.addEventListener('click', klikk);
  document.getElementById('kortdlg').addEventListener('click', function(e){if(e.target === this) lukkKort()});
  tegnRad();
  var dm = /[?&]demo(?:=(\d))?/.exec(location.search);
  if(dm) demoSpill(+dm[1]||5); else S = hent();
  if(S){sjekkJobber(); tegn()} else velkommen();
}
</script>

<script type="module">
/* =====================================================================
   Del 2: 3D-verdenen. Samme oppskrift som Dinoparken og fotballverdenen:
   low poly, flate farger, skråkamera uten perspektiv, og merkelapper som
   ligger oppå. Hvert område tegnes på nytt når trinnet endrer seg (BYGGERE).
   ===================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PI4 = Math.PI/4;
const canvas = document.getElementById('scene'), laster = document.getElementById('laster');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); }
catch(e){ laster.textContent = ''; throw e; }   // uten 3D vises områdene som vanlige knapper
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,900);
const HJEM = { x:-8, z:-8 };   // midten av bildet når ingenting er valgt
camera.position.set(120+HJEM.x,114,120+HJEM.z);   // langt unna, så ingenting havner bak kameraet
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.enablePan = false;
controls.minZoom = .8; controls.maxZoom = 3.6;
controls.minPolarAngle = .5; controls.maxPolarAngle = 1.15;
controls.target.set(HJEM.x,0,HJEM.z); controls.minAzimuthAngle = PI4-.55; controls.maxAzimuthAngle = PI4+.55;   // kan ikke snu helt rundt, for landet har en bakside

function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  const v = a<1 ? Math.max(76, 98/a) : Math.max(76, 146/a);
