<style>
:root{--hav:#b83a55;--hav-mork:#8f2a40;--ink:#2b2440;--kort:#fffaf3;--gull:#f2c230;--rod:#c8382e;--gronn:#2f8f46;--kant:#ecd9dc;--lys:#f6e8ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink);font-size:18px;line-height:1.4;background:linear-gradient(#d8effa,#fdeef2)}

canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.skilt{background:var(--kort);border:3px solid var(--ink);border-radius:16px;padding:6px 12px;display:flex;align-items:center;gap:8px;min-width:0}
.skilt .navn{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.1rem;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw}
.skilt .under{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:400;font-size:.8rem}
.brikke,button.brikke{background:var(--kort);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap;min-height:0}
button.brikke{min-height:44px}
header .luft{flex:1}

#tags button{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--kort);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;min-height:44px;white-space:nowrap;font-size:.95rem;z-index:2;box-shadow:0 3px 0 rgba(43,36,64,.25)}

.stasjon{text-align:left;background:#fff;color:var(--ink);border:2px solid var(--kant);border-radius:16px;padding:12px;display:block;width:100%}

.merke{display:inline-block;background:#e9e2ff;color:#44307a;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}

.valg{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}

.overlegg{position:fixed;inset:0;background:rgba(30,22,48,.6);display:grid;place-items:center;padding:16px;z-index:20}

.dialog.bred{max-width:640px}
.svar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

input[type=text]{font:inherit;padding:12px;border-radius:12px;border:2px solid #a79db5;width:100%}
.nivaa{display:inline-flex;gap:4px;vertical-align:middle}
.nivaa i{width:14px;height:14px;border-radius:50%;background:#e6dce4;display:inline-block}
.nivaa i.pa{background:var(--hav)}
.bok{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.bok div{border:2px solid var(--kant);border-radius:14px;padding:8px;text-align:center;font-size:.85rem}
.bok div.tom{background:#f6f3f8;color:#6a6080}
.bok strong{display:block;font-size:.95rem}
.merke.sj1{background:#ece8f0;color:#4a4060}.merke.sj2{background:#dcebff;color:#1f4a8a}.merke.sj3{background:#fff0c2;color:#7a5600}
.soyle{display:inline-block;position:relative;width:96px;height:12px;border-radius:6px;background:#e6dce4;vertical-align:middle;overflow:hidden}
.soyle i{position:absolute;left:0;top:0;bottom:0;background:var(--hav);border-radius:6px}
.soyle b{position:absolute;top:0;bottom:0;width:3px;margin-left:-3px;background:var(--ink)}
.belte{flex:none;width:38px;height:14px;border-radius:4px;border:2px solid var(--ink)}
.pokal{display:block;font-size:2rem;line-height:1.2}
.valg button{display:inline-flex;align-items:center;gap:6px}
.kratt{height:96px;border-radius:16px;background:linear-gradient(#e4f5d8 0 60%,#9bd975 60%);margin:10px 0;display:flex;align-items:flex-end;justify-content:center;gap:10px;overflow:hidden}
.kratt span{width:70px;height:60px;border-radius:50% 50% 0 0;background:#58a94c;border:3px solid var(--ink);border-bottom:0;transform-origin:50% 100%}
.kratt span:nth-child(2){height:78px;background:#6fbf5a}
.bokser{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.boksvalg{background:#fff;color:var(--ink);border:2px solid var(--kant);padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:.9rem}
.boksvalg small{display:block;font-weight:400;font-size:.78rem}
.boksvalg:disabled{background:#f6f3f8;color:#6a6080;opacity:.75}
.iboks{position:relative;display:inline-block}.iboks>span{position:absolute;left:50%;top:-6px;transform:translateX(-50%)}
.ring{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:8px 0}
.ring strong{display:block}.ring .mot{font-family:Fredoka,sans-serif;font-weight:700;color:#6a6080}
.ring .sliten svg,.ring .sliten img{filter:grayscale(1);opacity:.55;transform:rotate(18deg)}
.energi{display:block;height:14px;border-radius:7px;background:#e6dce4;overflow:hidden;border:2px solid var(--ink);margin:4px 0 2px}
.energi i{display:block;height:100%;background:var(--gronn);transition:width .4s}
.logg{background:var(--lys);border-radius:14px;padding:10px 12px;margin:10px 0;min-height:3.2em}.logg p{margin:0 0 4px}.logg p:last-child{margin:0}
.fag{width:100%;border-collapse:collapse;font-size:.9rem}.fag th,.fag td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--kant)}.fag td{white-space:nowrap}
.mbilde{object-fit:contain;vertical-align:middle}.mbilde.ukjent{filter:brightness(0);opacity:.28}
.iboks>span{top:-22px}
.boksvalg .sjanse{font-weight:700;border-radius:999px;padding:1px 8px;margin-top:3px}.sjanse.s3{background:#d8f0d6;color:#1d5a2a}.sjanse.s2{background:#fff0c2;color:#7a5600}.sjanse.s1{background:#f6d6d2;color:#8f2a24}
.stakk{display:inline-block;opacity:.45;transform:translateX(40px) rotate(12deg)}
.iko{width:1.35em;height:1.35em;object-fit:contain;vertical-align:-.32em}.brikke .iko{width:1.2em;height:1.2em}#gir .iko{width:30px;height:30px;vertical-align:middle}h2 .iko{width:1.5em;height:1.5em}
#laster{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:Fredoka,sans-serif;font-size:1.3rem;z-index:1}
@media (prefers-reduced-motion:no-preference){
  .dialog{animation:inn .18s ease-out}@keyframes inn{from{transform:translateY(12px);opacity:0}}
  .hopp svg,.hopp img{animation:hopp 1.1s ease-in-out infinite}@keyframes hopp{50%{transform:translateY(-8px)}}
  .kratt span{animation:rasle .5s ease-in-out infinite}.kratt span:nth-child(2){animation-delay:.15s}.kratt span:nth-child(3){animation-delay:.3s}
  @keyframes rasle{50%{transform:rotate(7deg) scale(1.06)}}
  .rister{animation:rister .3s ease-in-out infinite}@keyframes rister{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
}

<script>
/* =====================================================================
   SAKURADALEN – ramme for en monsterverden (prøveversjon)
   Del 1: regler og sider (denne blokka). Del 2: 3D-verdenen (lenger ned).
   Alt som har med OPPGAVER å gjøre går gjennom ett sted: startOppgave().
   Lagring bruker nøkler som starter med «sakuradalen-», slik at Tavleloftets
   elevinnlogging kan ta sikkerhetskopi på samme måte som i Dinoparken.

   Slik henger det sammen: hver løst oppgave gir mynter.
   JAKT:    let i enga, skogen eller på stranda -> velg boks -> løs oppgaver -> boksen rister ->
            fanget, eller monsteret stikker av. Sjeldne monstre er vanskeligere. Bedre boks hjelper.
   TRENING: velg monster og egenskap i dojoen -> løs en oppgave -> egenskapen vokser.
   DYST:    oppgaveduell i arenaen. Riktig svar = monsteret ditt gjør et trekk.
   Myntene brukes på bokser og på å bygge ut stedene.
   ===================================================================== */

/* ---------- Tall du kan skru på (balansen i spillet) ---------- */
var OPPSETT = {
  mynterPerOppgave: 5,    // mynter for én løst oppgave (fangst, trening og dyst)
  startmynter: 10,
  startbokser: 3,         // trekasser fra start
  nyttMonsterBonus: 5,    // ekstra mynter første gang et monster havner i Monsterboka
  dublett: [2, 6, 15],    // mynter for et monster du har fra før (vanlig, sjelden, legendarisk)
  nyFlaks: 3,             // monstre som mangler i boka dukker opp så mange ganger oftere
  venteMin: 900,          // millisekunder du leter før noe dukker opp (korteste og lengste)
  venteMaks: 2200,
  dojoTak: [0, 5, 10, 15],// høyeste nivå en egenskap kan trenes til på dojo nivå 1, 2 og 3
  arenaTrinn: [0, 3, 7, 10], // hvor mange motstandere som er åpne på arena nivå 1, 2 og 3
  /* FANGST. Sjansen (i prosent) for at monsteret blir i boksen: [vanlig, sjelden, legendarisk] for hver boks. */
  fangst: {tre:[80,35,10], lakk:[95,65,30], gull:[100,90,60]},
  fangstOppgaver: [1, 2, 3],  // hvor mange oppgaver eleven må løse for å lukke boksen (vanlig, sjelden, legendarisk)
  fangstRiktig: 10,           // sjansen øker så mye for hver oppgave som er riktig på første forsøk
  fangstFeil: 10              // og synker så mye for hver oppgave der første forsøk var galt
};
/* Stedene i verdenen. x og z er plasseringen i 3D-verdenen, h er høyden på merkelappen. */
var OMRADER = [
  {id:'eng',      ik:'🌸', navn:'Kirsebærenga',     x:-3,  z:-30, h:7},
  {id:'skog',     ik:'🎋', navn:'Bambusskogen',     x:-42, z:-33, h:9,   om:'Åpne bambusskogen. Her gjemmer skog- og steinmonstre seg.'},
  {id:'strand',   ik:'🐚', navn:'Stranda',          x:44,  z:3,   h:5.5, om:'Åpne stranda. Her finner du vannmonstre.'},
  {id:'dojo',     ik:'🥋', navn:'Dojoen',           x:-21, z:-10, h:9.5},
  {id:'verksted', ik:'🔨', navn:'Bokseverkstedet',  x:-37, z:4,   h:6.5},
  {id:'arena',    ik:'🥁', navn:'Dyst-arenaen',     x:38,  z:-21, h:8,   om:'Bygg arenaen og utfordre vokterne i dalen til oppgaveduell.'},
  {id:'trofe',    ik:'🏆', navn:'Troférommet',      x:-8,  z:-56, h:11,  h0:8.5, om:'Bygg et troférom på høyden. Her står pokalene og merkene dine.'}
];
/* Pris for nivå 1, 2 og 3. Pris 0 = du har det fra start. */
var PRIS = {eng:[0,40,100], skog:[30,60,120], strand:[50,80,140], dojo:[0,80,200], verksted:[0,50,130], arena:[40,100,220], trofe:[30,80,160]};
var BYGG = {
  eng:      {navn:'Kirsebærenga',    hva:['','Blomstereng','Kirsebærlund med hvilebenk','Lund med lite tempel'], gir:'Sjeldnere monstre våger seg fram.'},
  skog:     {navn:'Bambusskogen',    hva:['','Lysning i bambusen','Steinsti og lykt','Port til den hellige steinen'], gir:'Sjeldnere monstre våger seg fram.'},
  strand:   {navn:'Stranda',         hva:['','Sandstrand med fjærepytt','Båtplass og parasoll','Klippeport og port i sjøen'], gir:'Sjeldnere monstre våger seg fram.'},
  dojo:     {navn:'Dojo',            hva:['','Enkel dojo (nivå 5)','Treningshall (nivå 10)','Mesterpagode (nivå 15)'], gir:'Monstrene kan trenes til høyere nivå.'},
  verksted: {navn:'Bokseverksted',   hva:['','Lager trekasser','Lager lakkesker','Lager gullskrin'], gir:'Bedre bokser fanger sjeldnere monstre.'},
  arena:    {navn:'Arena',           hva:['','Ring med 3 motstandere','Tribuner og 4 nye motstandere','Tak, trommer og de 3 siste'], gir:'Flere motstandere og større pokaler.'},
  trofe:    {navn:'Troférom',        hva:['','Liten paviljong','Trofésal','Den gylne paviljongen'], gir:'Finere plass til pokalene dine.'}
};
/* De fem klassene. «slaar» = klassen denne er sterk mot. Ringen går rundt:
   Vann slår Ild, Ild slår Skog, Skog slår Stein, Stein slår Vind, Vind slår Vann. */
var KLASSER = [
  {id:'skog',  ik:'🌿', navn:'Skog',  c:'#58a94c', slaar:'stein'},
  {id:'vann',  ik:'💧', navn:'Vann',  c:'#3f8fd0', slaar:'ild'},
  {id:'ild',   ik:'🔥', navn:'Ild',   c:'#e8703a', slaar:'skog'},
  {id:'stein', ik:'🪨', navn:'Stein', c:'#8c8f9a', slaar:'vind'},
  {id:'vind',  ik:'🌬️', navn:'Vind',  c:'#9b8fd9', slaar:'vann'}
];
/* Sjeldenhet. «bonus» legges til alle fire egenskapene i dyst. */
var SJELDEN = [null,
  {navn:'Vanlig',      stj:'★',   bonus:0, w:6},
  {navn:'Sjelden',     stj:'★★',  bonus:2, w:2.5},
  {navn:'Legendarisk', stj:'★★★', bonus:4, w:1}
];
/* De fire egenskapene. «fag» er bare en merkelapp nå – her kobles oppgavetypene på senere. */
var EGENSKAPER = [
  {id:'styrke', ik:'💪', navn:'Styrke',       fag:'Fag 1 (f.eks. regning)',  om:'Hvor mye energi motstanderen mister når du svarer riktig.'},
  {id:'fart',   ik:'💨', navn:'Fart',         fag:'Fag 2 (f.eks. lesing)',   om:'Raskest starter. Er du raskest, smetter du unna hvert tredje trekk.'},
  {id:'uth',    ik:'❤️', navn:'Utholdenhet',  fag:'Fag 3 (f.eks. skriving)', om:'Hvor mye energi monsteret ditt har.'},
  {id:'klokt',  ik:'🧠', navn:'Kløkt',        fag:'Fag 4 (f.eks. klokka)',   om:'Monsteret skjønner hva som kommer og mister mindre energi.'}
];
/* Stasjoner som ikke er egenskaper: fangst og dyst. */
var FANGST = {id:'fangst', ik:'📦', navn:'Lukk boksen',   fag:'Fag 5 (f.eks. blandet repetisjon)'};
var DYST   = {id:'dyst',   ik:'🥁', navn:'Oppgaveduell',  fag:'Blandet fra alle fagene'};
/* Boksene. niv = verkstednivået som trengs. Hvor godt hver boks fanger, står i OPPSETT.fangst. */
var BOKSER = [
  {id:'tre',  navn:'Trekasse',  fl:'trekasser', pris:2,  niv:1, om:'Fin til vanlige monstre. Sjeldne stikker ofte av.'},
  {id:'lakk', navn:'Lakkeske',  fl:'lakkesker', pris:8,  niv:2, om:'God til vanlige og sjeldne monstre.'},
  {id:'gull', navn:'Gullskrin', fl:'gullskrin', pris:20, niv:3, om:'Den beste boksen. Trengs til de legendariske.'}
];
/* MONSTRENE. kl = klasse, sj = sjeldenhet (1–3), sted = hvor det lever, c = farge på plassholderen.
   «om» er en kort beskrivelse – den brukes også som utgangspunkt for bildene som skal lages.
   bilde = bildet av monsteret (laget med Higgsfield). Tas bilde bort, vises en enkel tegning i stedet.
   Stedet må være bygd ut til samme nivå som sjeldenheten før monsteret viser seg. */

/* ---------- Små hjelpere ---------- */
function rnd(n){return Math.floor(Math.random()*n)}
function klem(x,a,b){return Math.max(a,Math.min(b,x))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function finn(liste,id){return liste.filter(function(s){return s.id===id})[0]}
function omr(id){return finn(OMRADER,id)}
function mon(id){return finn(MONSTRE,id)}
function klasse(m){return finn(KLASSER,m.kl)}

/* ---------- Spilltilstand og lagring ---------- */
var S = null, apen = null;
var NOKKEL = 'sakuradalen-spill';
function lagre(){try{localStorage.setItem(NOKKEL, JSON.stringify(S))}catch(e){}}
function hent(){try{var t=localStorage.getItem(NOKKEL);t=t?JSON.parse(t):null;return t&&t.v===1?t:null}catch(e){return null}}
function nyttSpill(navn, f1, f2){
  S = {v:1, navn:navn||'Sakuradalen', f1:f1||FARGER[0], f2:f2||FARGER[6], mynter:OPPSETT.startmynter, oppg:0, fanget:0, dyster:0,
       anlegg:{eng:1, skog:0, strand:0, dojo:1, verksted:1, arena:0, trofe:0},
       bokser:{tre:OPPSETT.startbokser, lakk:0, gull:0},
       monstre:{},        // id -> {n: hvor mange fanget, st:[nivå på de fire egenskapene], tp:[treningspoeng mot neste nivå]}
       valgt:'',          // monsteret som trener og går i arenaen
       pokaler:0};        // hvor mange motstandere som er slått
  lagre();
}

/* ---------- Regler ---------- */
function eier(id){return S.anlegg[id]>0}
function antall(){return Object.keys(S.monstre).length}
function mine(){return MONSTRE.filter(function(m){return S.monstre[m.id]})}
function toppNiv(){var t=0; for(var id in S.monstre) S.monstre[id].st.forEach(function(n){if(n>t)t=n}); return t}
function bokserTotalt(){return S.bokser.tre+S.bokser.lakk+S.bokser.gull}
function dojoTak(){return OPPSETT.dojoTak[S.anlegg.dojo]}
/* Hvor mange treningsoppgaver som trengs for å gå opp fra dette nivået. */
function kravTP(niv){return niv<5 ? 1 : niv<10 ? 2 : 3}
/* Vanskegrad på treningsoppgavene: nivå 1–5 lett, 6–10 middels, 11–15 vanskelig. */
function vanskegrad(niv){return niv<=5 ? 1 : niv<=10 ? 2 : 3}
/* Hvorfor viser ikke dette monsteret seg nå? Tom tekst = det kan dukke opp. */
function hinder(m){
  if(m.sj > S.anlegg[m.sted]) return 'Bygg ut '+omr(m.sted).navn.toLowerCase()+' til nivå '+m.sj+'.';
  return '';
}
/* Sjansen for fangst i prosent, og hvordan den sies til eleven. */
function fangstSjanse(boksId, m, riktige, gale){ return klem(OPPSETT.fangst[boksId][m.sj-1] + (riktige||0)*OPPSETT.fangstRiktig - (gale||0)*OPPSETT.fangstFeil, 5, 100) }
function sjanseOrd(p){ return p>=95 ? 'Nesten sikkert' : p>=70 ? 'God sjanse' : p>=40 ? 'Kan gå' : p>=20 ? 'Vanskelig' : 'Veldig vanskelig' }
function trekkMonster(sted){
  var k = MONSTRE.filter(function(m){return m.sted===sted && !hinder(m)}); if(!k.length) return null;
  var w = k.map(function(m){return SJELDEN[m.sj].w * (S.monstre[m.id] ? 1 : OPPSETT.nyFlaks)});
  var sum = w.reduce(function(a,b){return a+b},0), r = Math.random()*sum, i = 0;
  while(i<k.length-1 && (r -= w[i]) > 0) i++;
  return k[i];
}
function mistBoks(boksId){ S.bokser[boksId]--; lagre() }   // monsteret stakk av, boksen er brukt
function fang(m, boksId){
  var e = S.monstre[m.id], ny = !e, bonus;
  if(ny){ S.monstre[m.id] = {n:1, st:[1,1,1,1], tp:[0,0,0,0]}; bonus = OPPSETT.nyttMonsterBonus; if(!S.valgt) S.valgt = m.id }
  else { e.n++; bonus = OPPSETT.dublett[m.sj-1] }
  S.bokser[boksId]--; S.fanget++; S.mynter += bonus; lagre();
  return {ny:ny, bonus:bonus};
}
function belonning(){ // kalles hver gang en oppgave er løst
  S.mynter += OPPSETT.mynterPerOppgave; S.oppg++; lagre();
  return OPPSETT.mynterPerOppgave;
}
/* Én løst treningsoppgave. Svarer om egenskapen gikk opp et nivå. */
function tren(id, i){
  var e = S.monstre[id]; if(!e || e.st[i] >= dojoTak()) return null;
  e.tp[i]++; var opp = e.tp[i] >= kravTP(e.st[i]);
  if(opp){ e.st[i]++; e.tp[i] = 0 }
  lagre(); return {opp:opp, niv:e.st[i]};
}
function bygg(id){
  var n = S.anlegg[id], p = PRIS[id][n];
  if(n >= PRIS[id].length || S.mynter < p) return false;
  S.mynter -= p; S.anlegg[id]++; lagre(); return true;
}
function kjopBoks(id){
  var b = finn(BOKSER,id); if(S.anlegg.verksted < b.niv || S.mynter < b.pris) return false;
  S.mynter -= b.pris; S.bokser[id]++; lagre(); return true;
}
/* ---------- Dyst-reglene (alt regnes ut her) ---------- */
function fordel(a, b){ return klasse(a).slaar===b.kl ? 1.5 : klasse(b).slaar===a.kl ? .75 : 1 }   // a sitt trekk mot b
function kampTall(m, niv){   // niv = liste med fire nivåer
  var b = SJELDEN[m.sj].bonus;
  return {styrke:niv[0]+b, fart:niv[1]+b, uth:niv[2]+b, klokt:niv[3]+b, energi:10+3*(niv[2]+b)};
}
function trekkKraft(fra, fraTall, til, tilTall){
  return Math.max(1, Math.round((2+fraTall.styrke)*fordel(fra,til)) - Math.floor(tilTall.klokt/2));
}
function aapneMotstandere(){return Math.min(OPPSETT.arenaTrinn[S.anlegg.arena], S.pokaler+1)}

/* =====================================================================
   OPPGAVER – ETT STED Å BYTTE UT
   startOppgave(stasjon, ferdig, feil) viser én oppgave.
   - ferdig(forste) kalles når eleven har svart riktig. forste = sann hvis det
     var riktig på første forsøk (brukes til fangstsjansen).
   - feil er valgfri. Uten den får eleven prøve til det blir riktig (fangst
     og trening). Med den er det ETT forsøk, og feil() kalles ved galt svar
     (dyst i arenaen).
   - niv er vanskegraden 1–3 (trening: nivået på egenskapen, fangst:
     sjeldenheten, dyst: hvor langt opp i beltene motstanderen er).
   «stasjon» er en av EGENSKAPER, FANGST eller DYST, så riktig fag kan velges.
   Prøveoppgaven under brukes bare hvis oppgaver.js ikke er lastet.
   De ekte oppgavene ligger i oppgaver.js, som bytter ut denne funksjonen.
   ===================================================================== */
function startOppgave(stasjon, ferdig, feil, niv){
  var a = 1+rnd(9), b = 1+rnd(9), riktig = a+b, valg = [riktig];
  while(valg.length<4){var v = klem(riktig + rnd(7)-3, 1, 20); if(valg.indexOf(v)<0) valg.push(v)}
  valg.sort(function(){return Math.random()-.5});
  dialog('<p class="proeve">Prøveoppgave. De ekte oppgavene for «'+esc(stasjon.navn)+'» kommer senere.</p>'+
    '<h2>'+stasjon.ik+' '+esc(stasjon.navn)+'</h2><p class="stort">'+a+' + '+b+' = ?</p>'+
    '<div class="svar">'+valg.map(function(v){return '<button data-svar="'+v+'">'+v+'</button>'}).join('')+'</div>'+
    '<p style="margin-top:14px"><button class="sek" data-a="lukk">'+(feil?'Gi opp dysten':'Avbryt')+'</button></p>',
    function(el){
      var bommet = false;
      el.addEventListener('click', function(e){
        var k = e.target.closest('[data-svar]'); if(!k) return;
        if(+k.dataset.svar === riktig) ferdig(!bommet);
        else if(feil) feil();
        else {k.classList.add('feil'); k.disabled = true; bommet = true}
      });
    });
}

function byggRad(id){

function klikk(e){
  var t = e.target.closest('button'); if(!t || t.disabled) return; var d = t.dataset;

  if(d.jakt) return jakt(d.jakt);

  if(d.bygg){if(bygg(d.bygg)){if(window.sprett3D) window.sprett3D(d.bygg); tegn()} return}
}

if(typeof document !== 'undefined'){

{ const hav = legg(scene, new THREE.CylinderGeometry(200,200,.4,28), new THREE.MeshStandardMaterial({color:HAVFARGE,roughness:.35,flatShading:true}), 0, HAV-.2, 0); hav.castShadow = false;

    const sig = S.anlegg[o.id] + '|' + ({ eng:her('eng'), skog:her('skog'), strand:her('strand'), dojo:S.valgt, arena:S.valgt+S.pokaler, trofe:S.pokaler }[o.id] || '');
    if(signatur[o.id] === sig+farger) return;
    signatur[o.id] = sig+farger; seed = 100 + OMRADER.indexOf(o)*17;
    tom(G[o.id]); BYGGERE[o.id](G[o.id], S.anlegg, f1hex, new THREE.Color(S.f2).getHex());
  });
  flaggene = flaggene.filter(iScenen); duppere = duppere.filter(d => iScenen(d.g));
};
window.sprett3D = id => { sprett[id] = performance.now(); };
let maal3 = { x:HJEM.x, z:HJEM.z, zoom:1 }, flytter = false;
window.fokus3D = id => { const o = id && OMRADER.find(o => o.id===id);
  maal3 = o ? { x:o.x, z:o.z, zoom:{ trofe:1.9, dojo:2, arena:2 }[o.id] || 2.2 } : { x:HJEM.x, z:HJEM.z, zoom:1 };
  if(o && innerWidth < 800){   // på smal skjerm dekker panelet nedre del: løft stedet opp i den synlige delen
    const dx = camera.position.x-controls.target.x, dz = camera.position.z-controls.target.z, l = Math.hypot(dx,dz)||1;
    const d = .23*(camera.top-camera.bottom)/maal3.zoom/Math.cos(controls.getPolarAngle());
    maal3.x += dx/l*d; maal3.z += dz/l*d;
  }
  flytter = true; };
controls.addEventListener('start', () => { flytter = false; });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let ned = null;
canvas.addEventListener('pointerdown', ev => { ned = { x:ev.clientX, y:ev.clientY }; });
canvas.addEventListener('pointerup', ev => {
  if(ned && S && Math.hypot(ev.clientX-ned.x, ev.clientY-ned.y) < 6){
    ndc.set(ev.clientX/innerWidth*2-1, -(ev.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera);
    const h = ray.intersectObjects(treff, false)[0];
    if(h) apne(h.object.userData.id);
  }
  ned = null;
});

const tags = document.getElementById('tags'); tags.className = ''; laster.remove();
const v3 = new THREE.Vector3();
function plasserTags(){
  const kn = tags.children;
  for(let i=0;i<kn.length;i++){ const o = OMRADER[i]; if(!o) continue;
    v3.set(o.x, eier(o.id) ? o.h : (o.h0||4.6), o.z).project(camera);
    kn[i].style.transform = 'translate(-50%,-100%) translate('+((v3.x+1)/2*innerWidth).toFixed(1)+'px,'+((1-v3.y)/2*innerHeight).toFixed(1)+'px)';
  }
}
window.sync3D();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for(const k in signatur) delete signatur[k]; window.sync3D(); });   // tegn skiltene på nytt når skriften er lastet
const rolig = matchMedia('(prefers-reduced-motion: reduce)').matches;
let forrige = 0;
function bilde(t){
  requestAnimationFrame(bilde);
  const k = 1 - Math.exp(-Math.min(.1,(t-forrige)/1000)*5); forrige = t;   // lik fart uansett hvor rask enheten er
  if(flytter){
    const fx = (maal3.x-controls.target.x)*k, fz = (maal3.z-controls.target.z)*k;   // flytt kamera og siktepunkt like mye
    controls.target.x += fx; controls.target.z += fz; camera.position.x += fx; camera.position.z += fz;
    camera.zoom += (maal3.zoom-camera.zoom)*k; camera.updateProjectionMatrix();
    if(Math.abs(maal3.x-controls.target.x)+Math.abs(maal3.z-controls.target.z)+Math.abs(maal3.zoom-camera.zoom) < .01) flytter = false;
  }
  for(const id in sprett){ const d = (t-sprett[id])/450; if(d >= 1){ G[id].scale.setScalar(1); delete sprett[id]; } else G[id].scale.setScalar(1 + Math.sin(d*PI)*.1); }
  if(!rolig){
    flaggene.forEach((f,i) => { f.rotation.y = Math.sin(t/420+i)*.22; });
    duppere.forEach(d => { d.g.position.y = d.y + Math.abs(Math.sin(t/520+d.f))*d.a*1.6; });                 // monstrene hopper litt, båten dupper
    kretser.forEach(m => { m.g.rotation.y = t/1000*m.fart; });                                              // tranene kretser
    blader.forEach(b => { const u = b.userData, s = (t/1000*u.fart + u.f) % 20; b.position.set(u.x + Math.sin(s*1.3+u.f)*2 + s*.6, 20 - s, u.z + Math.cos(s+u.f)*1.5); b.rotation.set(s*2, s*1.4+u.f, s); });
  }
  controls.update(); renderer.render(scene, camera);
  if(S) plasserTags();
}
requestAnimationFrame(bilde);
</script>
